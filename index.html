 var h='<div class="hd">'+hdTitle('HR Admin Dashboard','People, assessment coverage and actions requiring your attention.',false)+'<div class="hd-metrics">';
 h+=hdCard(m.people.length,'Total Staff','hr-people-all','indigo','View all employees');h+=hdCard(ok?m.assessed.length+' ('+m.coverage+'%)':'--','Assessed','hr-people-assessed','green','View assessed employees');h+=hdCard(ok?m.notAssessed.length:'--','Not Assessed','hr-people-pending','amber','View outstanding employees');h+=hdCard(data.positions?m.critical.length:'--','Critical Positions','hr-position-critical','rose','View critical roles');h+=hdCard(data.positions?m.positions.length:'--','Total Positions','hr-position-all','purple','View position registry');
 h+='</div><p class="hd-note">Assessed means a current-role manager submission exists, not that HR review is complete. Positions are unique department/position pairs; Non-Critical roles are excluded from Critical Positions.</p>';
 if(Object.keys(data.errors).length)h+='<div class="hd-warning">Some data could not load: '+escapeHtml(Object.keys(data.errors).join(', '))+'. Unavailable queues are not reported as zero.</div>';
 h+='<section class="hd-card hd-action-panel"><div class="hd-heading"><h2>'+edIcon('bell')+' Notifications &amp; Actions Needed</h2>'+hdButton('View all actions','hr-actions-all')+'</div>'+hdActionHTML(data,m,true)+'</section>';
 h+='<div class="hd-columns"><section class="hd-card"><h2>Assessment Coverage</h2><div class="hd-coverage"><strong>'+(ok?m.coverage+'%':'--')+'</strong><p>'+(ok?m.assessed.length+' of '+m.people.length+' employees assessed':'Assessment data unavailable')+'</p></div>'+hdButton('View coverage by position','hr-coverage')+'</section><section class="hd-card"><h2>Recent Assessment Activity</h2>';
 h+=m.recent.length?m.recent.map(r=>'<div class="hd-recent"><div><strong>'+escapeHtml(r.employee_name||r.employee_id)+'</strong><p>'+escapeHtml(r.type)+' | '+escapeHtml(r.assessment_date||'No date')+' | Round '+r.round_number+'</p></div>'+hdCall('View','hdOpenAssessment',[r.employee_id])+'</div>').join(''):'<p>No current assessment records to show.</p>';
 h+=hdButton('View all assessments','hr-all')+'</section></div><h2>Quick Actions</h2><div class="hd-quick">'+hdButton('Communicate to Employee','hr-communicate')+hdButton('Invite Prospective Assessment','hr-prosp-invites')+hdButton('Review Competencies','hr-comp-approvals')+hdButton('C-Suite Mapping','hr-csuite-mapping');
 if(window.CMS_ACCESS&&CMS_ACCESS.can_manage)h+=hdButton('Manage User Access','hr-user-access');h+='</div></div>';setContent(h);hdFilters();}
function hdFilters(){var host=document.getElementById('hdFilters');if(!host)return;var data=HD.data;
 var c=document.createElement('select');c.setAttribute('aria-label','Company scope');c.add(new Option('All companies',''));Array.from(new Set(data.employees.map(e=>hdNorm(e.company)).filter(Boolean))).sort().forEach(x=>c.add(new Option(x,x)));c.value=HD.company;
 var dep=document.createElement('select');dep.setAttribute('aria-label','Department scope');dep.add(new Option('All departments',''));Array.from(new Set(data.employees.filter(e=>!HD.company||hdNorm(e.company)===HD.company).map(e=>hdNorm(e.department)).filter(Boolean))).sort().forEach(x=>dep.add(new Option(x,x)));dep.value=HD.department;

async function hdDetail(kind){if(!hdAllowed())return;var epoch=CN.epoch;setContent('<div class="card">Loading scoped details...</div>');
 try{var data=await hdLoad();if(epoch!==CN.epoch)return;HD.data=data;var m=hdModel(data,HD.company,HD.department),titles={all:'All Employees',assessed:'Assessed Employees',pending:'Employees Not Yet Assessed',critical:'Critical Positions',positions:'Position Registry',coverage:'Assessment Coverage by Position'};
 var h='<div class="hd">'+hdTitle(titles[kind],hdScopeText(),true)+'<section class="hd-card">';
 if(['all','assessed','pending'].includes(kind)){
 if(kind!=='all'&&!data.assessments)throw new Error('Assessment data unavailable: '+data.errors.assessments);
 var people=kind==='all'?m.people:kind==='assessed'?m.assessed:m.notAssessed;
 h+='<p>Assessed = at least one current-role manager submission. Self-only employees remain Not Assessed under this metric.</p><div class="table-wrap"><table><thead><tr><th>Employee</th><th>Company / Department</th><th>Position</th><th>Manager submission</th><th>Details</th></tr></thead><tbody>';
 h+=people.map(e=>'<tr><td>'+escapeHtml(e.employee_name)+'</td><td>'+escapeHtml(e.company||'')+' / '+escapeHtml(e.department||'')+'</td><td>'+escapeHtml(e.position)+'</td><td>'+(m.done.has(e.employee_id)?'Submitted':'Not submitted')+'</td><td>'+hdCall('View assessments','hdOpenAssessment',[e.employee_id])+'</td></tr>').join('');h+='</tbody></table></div><p>'+people.length+' employee(s) in this filtered list.</p>';
 }else{
 if(!data.positions)throw new Error('Position registry data unavailable: '+data.errors.positions);
 var list=kind==='critical'?m.critical:m.positions;
 h+='<p>Unique department/position pairs from the registry and employee records. Company-scoped results cover occupied positions only. Conflicting criticality entries are flagged, not guessed.</p>'+hdButton('Manage Positions & Criticality','hr-positions')+'<div class="table-wrap"><table><thead><tr><th>Department</th><th>Position</th><th>Criticality</th><th>Employees</th><th>Assessed</th><th>Coverage</th></tr></thead><tbody>';
 h+=list.map(p=>'<tr><td>'+escapeHtml(p.department)+'</td><td>'+escapeHtml(p.position)+'</td><td>'+escapeHtml(p.conflict?'Conflicting registry entries':p.criticality||'Not recorded')+'</td><td>'+p.people.length+'</td><td>'+(data.assessments?p.assessed:'Unavailable')+'</td><td>'+(data.assessments&&p.people.length?Math.round(p.assessed/p.people.length*100)+'%':'--')+'</td></tr>').join('');h+='</tbody></table></div>';
 }setContent(h+'</section></div>');}catch(e){if(epoch===CN.epoch)setContent('<div class="card"><p>'+escapeHtml(e.message)+'</p>'+hdButton('Back to Dashboard','hr-dashboard')+'</div>');}}
async function hdActionPage(kind){if(!hdAllowed())return;var epoch=CN.epoch;setContent('<div class="card">Loading action queue...</div>');
 try{var data=await hdLoad();if(epoch!==CN.epoch)return;HD.data=data;var m=hdModel(data,HD.company,HD.department),actions=hdActions(data,m);
 if(kind==='all'){setContent('<div class="hd">'+hdTitle('Notifications & Actions Needed',hdScopeText(),true)+'<section class="hd-card">'+hdActionHTML(data,m)+'</section></div>');return;}
 var def=actions.find(x=>x[0]===kind);if(!def)throw new Error('Unknown action queue');if(data[def[3]]===null)throw new Error(data.errors[def[3]]);
 var h='<div class="hd">'+hdTitle(def[1],hdScopeText(),true)+'<section class="hd-card"><p>'+def[2].length+' item(s). Counts show current records, not unread notifications.</p>';
 def[2].forEach(r=>{
 h+='<div class="hd-action"><div>';
 if(kind==='missing')h+='<h3>'+escapeHtml(r.company)+' / '+escapeHtml(r.department)+'</h3><p>No enabled trusted default for this scope.</p>';
 else if(kind==='frameworks')h+='<h3>'+escapeHtml(r.position||'Company-wide Core')+'</h3><p>'+escapeHtml(r.department||'Company-wide')+' | '+r.experience_rows+' experiences</p>';
 else h+='<h3>'+escapeHtml(r.employee_name||r.employee_id)+'</h3><p>'+escapeHtml(r.type||r.task||r.status||r.comp_name||'')+(kind==='review'?' | '+r.pending_rows+' pending experience rows':kind==='returned'?' | '+r.returned_rows+' returned experience rows':'')+'</p>';
 h+='</div>';
 if(kind==='review'||kind==='returned')h+=hdCall('Open Review','goReview',[r.employee_id]);
 else if(kind==='plans'||kind==='progress')h+=hdCall('Open development review','openDPFor',[r.employee_id]);
 else if(kind==='frameworks')h+=hdButton('Review framework','hr-comp-approvals');
 else if(kind==='redos')h+=hdCall('Review request','hdRedo',[String(r.id)]);

 else if(kind==='unassigned')h+=hdCall('Assign privately','exAssign',[r.id]);
 else if(kind==='missing')h+=hdButton('Set mapping','hr-csuite-mapping');
 else if(kind==='reportApprovals')h+=hdButton('Open approvals','hr-repappr');h+='</div>';
 });h+='</section><div id="hdRequest"></div></div>';setContent(h);
 }catch(e){if(epoch===CN.epoch)setContent('<div class="card"><p>Queue unavailable: '+escapeHtml(e.message)+'</p>'+hdButton('Back to Dashboard','hr-dashboard')+'</div>');}}
async function hdRedo(id){var host=document.getElementById('hdRequest');if(!host)return;try{var r=(HD.data.redos||[]).find(x=>String(x.id)===id);if(!r)throw new Error('Refresh this request list.');if(r.type==='Prospective Self'){host.innerHTML='<section class="hd-card"><h3>Prospective self-assessment request</h3><p>'+escapeHtml(r.employee_name)+' | '+escapeHtml(r.reason||'')+'</p><p>This requires an HR/HOHR invitation, not an automatic score-based unlock. Review the request and issue an invitation if appropriate.</p>'+hdButton('Open Prospective Invitations','hr-prosp-invites')+'</section>';return;}host.innerHTML='<section class="hd-card"><h3>'+escapeHtml(r.employee_name)+' | '+escapeHtml(r.type)+'</h3><p>'+escapeHtml(r.reason||'')+'</p><label>Decision comment<input id="rc-'+escapeHtml(id)+'"></label><button class="btn btn-primary" onclick="hdRedoDecision('+rcArg(id)+',true)">Approve redo</button><button class="btn btn-outline" onclick="hdRedoDecision('+rcArg(id)+',false)">Reject redo</button></section>';}catch(e){host.textContent=e.message;}}

async function hrRoutingPage(){if(!rcHR())return;var epoch=CN.epoch,root=rcShell('C-Suite Mapping');
 rcNode('p','Set a default executive for each company and department. A default only suggests a recipient when HR creates a NEW private case. It never reassigns existing cases, broadcasts reports or shares another executive’s comments.',root);
 rcButton('Back to Dashboard',()=>navigateTo(APP.currentRole==='hr'?'hr-dashboard':'hohr-dash'),root);
 try{
 var [scopes,members,mappings,legacy]=await Promise.all([hdAll('cms_csuite_routing','scopes'),hdRPC('cms_csuite_routing','members'),hdAll('cms_csuite_routing','list'),hdAll('cms_csuite_routing','legacy')]);
 if(epoch!==CN.epoch||!root.isConnected)return;
 var editor=rcCard(root);rcNode('h3','New or updated routing default',editor);

 if(!members.length)rcNode('p','No enabled verified executives. Use User Access to enable the appropriate accounts first.',editor);

 rcButton('Preview mapping',()=>{

 var s=scopes[Number(scope.value)],old=mappings.find(m=>m.company===s.company&&m.department===s.department),person=members.find(m=>m.id===exec.value);
 var payload={company:s.company,department:s.department,executive_id:exec.value,expected_version:old?old.version:0,reason:reason.value.trim()};
 preview.replaceChildren();rcNode('p','Change 1 routing default: '+s.company+' / '+s.department+' from '+(old?old.email:'No default')+' to '+person.email+'. Existing assignments remain unchanged.',preview);
 rcButton('Confirm and save mapping',async()=>{await hdRPC('cms_csuite_routing','save',payload);showToast('Routing default saved. Existing cases unchanged.');await hrRoutingPage();},preview);
 },editor);
 var list=rcCard(root);rcNode('h3','Trusted routing defaults',list);if(!mappings.length)rcNode('p','No trusted defaults configured yet.',list);
 mappings.forEach(m=>{var c=rcCard(list);rcNode('strong',m.company+' / '+m.department,c);rcNode('p',m.email+' | '+(m.enabled?'Enabled executive':'Executive disabled; default will not be suggested'),c);

 rcButton('Remove default',()=>{var why=prompt('Reason for removing this routing default:');if(!why)return;if(!confirm('Remove 1 default for '+m.company+' / '+m.department+' → '+m.email+'? Existing private cases remain unchanged.'))return;return hdRPC('cms_csuite_routing','remove',{company:m.company,department:m.department,expected_version:m.version,reason:why}).then(()=>hrRoutingPage());},c);
 });

 if(!legacy.length)rcNode('p','No legacy mappings found.',old);legacy.forEach(m=>rcNode('p',(m.company||'Any company')+' / '+(m.department||'No department')+' → '+(m.csuite_email||'No executive'),old));
 var audit=rcCard(root);rcNode('h3','Mapping change history',audit);await hrRoutingHistory(audit,0);

// Add a suggested default to the existing one-executive assignment form.
// No existing assignment or report comment is read or copied by this helper.
var hdOldAssign=exAssign;
exAssign=async function(reportId){
 await hdOldAssign(reportId);
 var root=document.getElementById('exRoot');if(!root||!rcHR())return;
 var report=root.querySelector('select[aria-label="Original HR report"]'),member=root.querySelector('select[aria-label="Assigned executive"]');if(!report||!member)return;
 var note=document.createElement('p');note.className='hd-routing-note';note.style.cssText='font-size:13px;color:#64748b;margin:10px 0';member.after(note);var serial=0;
 async function suggest(){var token=++serial,id=report.value;member.value='';if(!id){note.textContent='Choose a report to check its company/department default.';return;}
 note.textContent='Checking routing default...';
 try{var value=await hdRPC('cms_csuite_routing','suggest',{report_id:id});if(token!==serial||!root.isConnected||report.value!==id)return;
 if(value&&Array.from(member.options).some(o=>o.value===value.executive_id)){member.value=value.executive_id;note.textContent='Suggested default: '+value.email+' ('+value.company+' / '+value.department+'). Verify the recipient and write a new brief before assigning.';}
 else note.textContent='No enabled trusted default. Select one verified executive explicitly; nothing will be broadcast.';
 }catch(e){if(token===serial&&root.isConnected)note.textContent='Routing lookup unavailable. Select one executive explicitly: '+e.message;}
 }

<script>
/* Performance only: compact dashboard payloads, single-flight reads, no saved-draft changes. */
var PF={generation:0,reads:new Map(),library:null,libraryOwner:null,loginBusy:false};
function pfClear(){PF.generation++;PF.reads.clear();}
async function pfSummary(name,args,force){
 var key=JSON.stringify([APP.user&&APP.user.email,APP.currentRole,name,args||{}]);
 if(force)PF.reads.delete(key);var previous=PF.reads.get(key);
 if(previous&&Date.now()-previous.time<15000)return previous.promise;
 var entry={time:Date.now()};entry.promise=(async()=>{var q=await _supabase.rpc(name,args);if(q.error)throw new Error(q.error.message);return q.data;})();
 PF.reads.set(key,entry);try{return await entry.promise;}catch(e){if(PF.reads.get(key)===entry)PF.reads.delete(key);throw e;}
}
// Invalidate summaries for app writes, but do not cache or replay a write.
var pfFrom=_supabase.from.bind(_supabase);
_supabase.from=function(table){var q=pfFrom(table);['insert','update','upsert','delete'].forEach(method=>{if(typeof q[method]==='function'){var old=q[method].bind(q);q[method]=function(...args){pfClear();return old(...args);};}});return q;};
var pfRPC=_supabase.rpc.bind(_supabase);
_supabase.rpc=function(name,args,...rest){var readNames=new Set(['cms_dashboard_summary','cms_manager_summary','cms_dashboard_alerts','cms_scoring_policy_version','cms_my_manager_positions']);var readActions=new Set(['me','list','inbox','search','history','audit','members','get','catalogue','queue','open','mine','targets','manager_target','team','assessments','alerts','scopes','legacy','suggest','employees','positions','frameworks','plans','progress','redos','reports','report_approvals','executive']);
 if(!readNames.has(name)&&!(args&&readActions.has(args.p_action)))pfClear();return pfRPC(name,args,...rest);};

 var user=APP.user&&APP.user.email;if(PF.library&&PF.libraryOwner===user)return PF.library;
 PF.libraryOwner=user;PF.library=(async()=>{var all=[];for(var start=0;;start+=500){var q=await _supabase.from('experiences').select('*').order('id').range(start,start+499);if(q.error)throw new Error(q.error.message);all.push(...(q.data||[]));if((q.data||[]).length<500)break;}
 if(APP.user&&APP.user.email===user)APP.experiences=all;return all;})();
 try{return await PF.library;}catch(e){PF.library=null;throw e;}
}

_supabase.rpc=function(name,args,...rest){
 var reads=new Set(['me','list','inbox','search','history','audit','members','get','catalogue','queue','open','mine','targets','manager_target','team','assessments','alerts','scopes','legacy','suggest','employees','positions','frameworks','plans','progress','redos','reports','report_approvals','executive','current']);
 if(SU.blocked&&!reads.has(args&&args.p_action)&&!['cms_dashboard_summary','cms_manager_summary','cms_dashboard_alerts','cms_scoring_policy_version','cms_my_manager_positions'].includes(name))throw new Error('System update required. Save drafts and sign in again.');
 if(!reads.has(args&&args.p_action)&&!['cms_dashboard_summary','cms_manager_summary','cms_dashboard_alerts','cms_scoring_policy_version','cms_my_manager_positions'].includes(name))SU.cache.clear();
 return suOriginalRPC(name,args,...rest);
};
var suFrom=_supabase.from.bind(_supabase);_supabase.from=function(table){var q=suFrom(table);['insert','update','upsert','delete'].forEach(k=>{if(q[k]){var old=q[k].bind(q);q[k]=function(...args){if(SU.blocked)throw new Error('System update required. Save drafts and sign in again.');SU.cache.clear();return old(...args);};}});return q;};
var suOldLogin=doLogin;doLogin=async function(){if(SU.loginRunning)return;SU.loginRunning=true;SU.freshLogin=true;try{return await suOldLogin();}finally{SU.freshLogin=false;SU.loginRunning=false;}};
var suOldLogout=doLogout;doLogout=async function(){suSaveAll();clearTimeout(SU.timer);SU.cache.clear();SU.generation=null;suAuthClear();return suOldLogout();};
var suOldNav=setupNav;setupNav=function(role){suOldNav(role);var root=document.getElementById(role==='employee'?'mainNav':'sideNav');if(root){var b=rcButton('Saved Drafts',()=>navigateTo('cms-saved-drafts'),root);b.dataset.page='cms-saved-drafts';b.className=role==='employee'?'nav-btn':'sb-item';if(role!=='employee')b.style.cssText='width:100%;background:transparent;border:0;text-align:left';}
 if(role==='hr'&&root){var b=rcButton('Publish System Update',()=>navigateTo('hr-system-update'),root);b.dataset.page='hr-system-update';b.className='sb-item';b.style.cssText='width:100%;background:transparent;border:0;text-align:left';}};
var suOldLabel=getPageLabel;getPageLabel=function(id){return id==='hr-system-update'?'Publish System Update':id==='cms-saved-drafts'?'Saved Drafts':suOldLabel(id);};
var suOldPage=loadPage;loadPage=async function(id){if(SU.blocked)return;if(id==='hr-system-update')return suPublishPage();if(id==='cms-saved-drafts')return suSavedDrafts();return suOldPage(id);};
var suOldNavigate=navigateTo;navigateTo=function(id,history){if(SU.blocked)return;suSaveAll();return suOldNavigate(id,history);};
// Save text safety copies on input instead of relying solely on unreliable unload events.
['input','change'].forEach(type=>document.addEventListener(type,function(e){if(!APP.user||!e.target.closest||!e.target.closest('#mainContent')||e.target.type==='password')return;clearTimeout(SU.draftTimer);SU.draftTimer=setTimeout(suSaveAll,400);}));
window.addEventListener('pagehide',()=>{suSaveAll();});
document.addEventListener('visibilitychange',()=>{if(document.hidden)suSaveAll();else suCheck();});
window.addEventListener('focus',()=>{if(Date.now()-SU.lastCheck>15000)suCheck();});
var suToolbarTimer;new MutationObserver(()=>{clearTimeout(suToolbarTimer);suToolbarTimer=setTimeout(suDraftToolbar,200);}).observe(document.getElementById('mainContent'),{childList:true,subtree:true});
// Returning read-only dashboard: show an inert snapshot immediately while fresh authorized data loads.
var suPreviewPages=new Set(['hr-dashboard','hohr-dash','mgr-dashboard','emp-profile']);
var suPreviewPage=loadPage;loadPage=async function(id){
 var older=document.getElementById('suCachedPreview');if(older)older.remove();
 var root=document.getElementById('mainContent');root.hidden=false;var cacheEpoch=CN.epoch,key=JSON.stringify([APP.user&&APP.user.email,APP.currentRole,id]),cached=SU.cache.get(key),preview=null;
 if(suPreviewPages.has(id)&&cached&&Date.now()-cached.time<120000&&!SU.blocked){
  preview=document.createElement('section');preview.id='suCachedPreview';preview.inert=true;preview.innerHTML='<div style="padding:10px;background:#fff4dd;color:#713f12;border-radius:8px">Refreshing live data. Previous dashboard shown temporarily; controls are disabled.</div>'+cached.html;
  preview.querySelectorAll('*').forEach(n=>{n.removeAttribute('id');n.removeAttribute('name');for(var a of Array.from(n.attributes)){if(a.name.startsWith('on'))n.removeAttribute(a.name);}if(['BUTTON','INPUT','SELECT','TEXTAREA'].includes(n.tagName))n.disabled=true;});
  preview.style.cssText='pointer-events:none;opacity:.9;max-width:1440px;margin:auto;padding:20px';root.before(preview);root.hidden=true;
 }
 try{await suPreviewPage(id);if(suPreviewPages.has(id)&&APP.currentPage===id&&!SU.blocked&&root.querySelector('.hd-metrics,.hh-metrics,.md-metrics,#epProfile'))SU.cache.set(key,{time:Date.now(),html:root.innerHTML});}
 finally{if(preview)preview.remove();if(cacheEpoch===CN.epoch)root.hidden=false;}
};

async function suStartApp(){
 try{
  if(!CMS_TAB_STORAGE_OK){showLoginScreen();suLoginNotice('Allow session storage in this browser to sign in safely.');return;}
  var response=await _supabase.auth.getSession();if(response.error)throw response.error;
  if(response.data&&response.data.session){setContent('<section class="card"><p>Restoring your session...</p></section>');await enterApp(response.data.session.user.email);}
  else showLoginScreen();
 }catch(e){showLoginScreen();suLoginNotice('Could not restore login: '+(e.message||'Please try signing in again.'));}
}

</script>
<script>suStartApp();</script>
