function calculateCompetencyScore(empId, compCode, type, allResults) {
var rows = allResults.filter(function (r) { return r['Employee ID'] === empId && r['Competency Code'] === compCode && r['Type'] === type; });
if (rows.length === 0) return { score: 0, total: 0, valid: 0 };
var tiers = { critical: { total: 0, points: 0, valid: 0 }, important: { total: 0, points: 0, valid: 0 }, valueAdd: { total: 0, points: 0, valid: 0 } };
for (var i = 0; i < rows.length; i++) {
var r = rows[i];
var classification = (r['Classification'] || '').toString().trim();
var ticked = (r['Ticked'] === true || r['Ticked'] === 'TRUE' || r['Ticked'] === 1);
var evidence = (r['Evidence'] || '').toString().trim();
var hrStatus = (r['HR_Status'] || '').toString().trim();
var rating = parseFloat(r['Rating']);
var hasRating = (rating >= 1 && rating <= 5);
var isValid = (ticked && evidence !== '' && hrStatus !== 'Disapproved' && hasRating);
if (classification.indexOf('Critical') !== -1 || classification.indexOf('Must-Have') !== -1) { tiers.critical.total++; if (isValid) { tiers.critical.valid++; tiers.critical.points += rating / 5; } }
else if (classification.indexOf('Important') !== -1 || classification.indexOf('Performance') !== -1) { tiers.important.total++; if (isValid) { tiers.important.valid++; tiers.important.points += rating / 5; } }
else { tiers.valueAdd.total++; if (isValid) { tiers.valueAdd.valid++; tiers.valueAdd.points += rating / 5; } }
}
var tierMax = tierMaximums(tiers);
var presentTiers = [];
['critical','important','valueAdd'].forEach(function(k){ if (tiers[k].total > 0) presentTiers.push(k); });
if (presentTiers.length === 0) return { score: 0, total: rows.length, valid: 0 };
var score = 0;
for (var t = 0; t < presentTiers.length; t++) {
var tierKey = presentTiers[t];
score += (tiers[tierKey].points / tiers[tierKey].total) * tierMax[tierKey];
}score = Math.round(score * 100) / 100;
return { score: score, total: rows.length, valid: tiers.critical.valid + tiers.important.valid + tiers.valueAdd.valid };
}
function calculateOverallScore(empId, type, allResults) {
var totalWeight = 0; var weightedScore = 0;
for (var i = 0; i < APP.competencies.length; i++) {
var comp = APP.competencies[i];
var w = parseFloat(comp.weight) || 0;
var cs = calculateCompetencyScore(empId, comp.code, type, allResults);
if (cs.total > 0) { totalWeight += w; weightedScore += Math.round((cs.score / 5) * 100) * w; }
}
return totalWeight > 0 ? Math.round(weightedScore / totalWeight) : 0;
}

function getClassificationTier(classification) {
var cls = (classification || '').toString().trim();
if (cls.indexOf('Critical') !== -1 || cls.indexOf('Must-Have') !== -1) return 'critical';
if (cls.indexOf('Important') !== -1 || cls.indexOf('Performance') !== -1) return 'important';

function calculateWeightedDisplayScore(experiences) {
var tiers = { critical: { total: 0, points: 0 }, important: { total: 0, points: 0 }, valueAdd: { total: 0, points: 0 } };
experiences.forEach(function(exp) {
var tier = getClassificationTier(exp.classification);
tiers[tier].total++;
if (exp.ticked && (exp.evidence || '') !== '' && (exp.rating || 0) >= 1) tiers[tier].points += ((exp.rating || 0) / 5);
});
var tierMax = tierMaximums(tiers);
var presentTiers = [];
['critical','important','valueAdd'].forEach(function(tier) { if (tiers[tier].total > 0) presentTiers.push(tier); });
if (!presentTiers.length) return '0.0';
var score = 0;
presentTiers.forEach(function(tier) {
score += (tiers[tier].points / tiers[tier].total) * tierMax[tier];
});
return score.toFixed(1);
}
function getPositionExperiences(positionName, department, compLevel) {
var result = {};
var levelMap = { 'Foundational':'Foundational','Intermediate':'Intermediate','Intermidiate':'Intermediate','Advanced':'Advanced','Master':'Master' };
var ml = levelMap[compLevel] || 'Intermediate';
for (var i = 0; i < APP.experiences.length; i++) {
var row = APP.experiences[i];
var code = row.comp_code;
if (!code) continue;
if (code.indexOf('CC') === 0) {
if ((row.competency_level || '').trim() === ml && row.experience_text) {
if (!result[code]) result[code] = [];
result[code].push({ idx: result[code].length, text: row.experience_text, classification: row.classification || 'Must-Have (Critical)' });
}
} else {
if ((row.department || '').toString().toUpperCase().trim() === (department || '').toString().toUpperCase().trim() &&
(row.position_name || '').toString().toUpperCase().trim() === (positionName || '').toString().toUpperCase().trim() && row.experience_text) {
if (!result[code]) result[code] = [];
result[code].push({ idx: result[code].length, text: row.experience_text, classification: row.classification || '' });
}
}
}
return result;
}

async function aiSuggestDP() {

var plan = JSON.parse(clean);

document.getElementById('dpTasks').innerHTML = '';
window._taskCount = 0;
plan.tasks.forEach(function(t) {
addTask();
var ti = window._taskCount - 1;
document.getElementById('dpt-' + ti).value = t.task || '';
(t.actions || []).forEach(function(a, ai) {
if (ai > 0) addAction(ti);
document.getElementById('dpa-' + ti + '-' + ai).value = a.action || '';
document.getElementById('dpm-' + ti + '-' + ai).value = a.measure || '';
document.getElementById('dpr-' + ti + '-' + ai).value = a.responsible || '';
document.getElementById('dpp-' + ti + '-' + ai).value = a.period || '';
});

async function submitDP(empId) {

endDate: document.getElementById('dpe-' + ti + '-' + ai).value,

const { data: emp } = await _supabase.from('employees').select('*').eq('employee_id', empId).single();

async function generateDPReports(planId) {
const { data: rows } = await _supabase.from('dev_plans').select('*').eq('plan_id', planId);
if (!rows || !rows.length) return;
const { data: existing } = await _supabase.from('dp_reports').select('id').eq('plan_id', planId);
if (existing && existing.length) return;
var r0 = rows[0];
var start = r0.start_date ? new Date(r0.start_date) : new Date();
var end = r0.end_date ? new Date(r0.end_date) : null;
var months = 1;
if (end && end > start) months = Math.max(1, Math.min(12, Math.ceil((end - start) / 2592000000)));
var inserts = [];
for (var m = 1; m <= months; m++) {
var due = new Date(start.getFullYear(), start.getMonth() + m, 0);
if (due < start) due = new Date(start);
inserts.push({ plan_id: planId, employee_id: r0.employee_id, employee_name: r0.employee_name, position: r0.position, comp_name: r0.comp_name, task: r0.task, month_no: m, due_date: due.toISOString().slice(0,10), created_date: new Date().toISOString().slice(0,10) });
}

}

// Index existing experiences by "CODE|DEPT|POS" for fast lookup
var expIndex = {};
(APP.experiences || []).forEach(function(x) {
if ((x.comp_code || '').indexOf('CC') === 0) return; // Ignore core
var key = (x.comp_code||'').toUpperCase() + '|' + (x.department||'').toUpperCase().trim() + '|' + (x.position_name||'').toUpperCase().trim();
expIndex[key] = x;
});

json.forEach(function(r){
var m = {}; for (var k in r) m[norm(k)] = r[k];
var code = (m['competencycode'] || m['code'] || '').toString().trim();
var text = (m['experiencetext'] || m['text'] || m['experience'] || '').toString().trim();
var clsRaw = (m['classification'] || '').toString().toLowerCase();
var cls = '';
if (clsRaw.indexOf('critical') >= 0 || clsRaw.indexOf('must') >= 0) cls = 'Must-Have (Critical)';
else if (clsRaw.indexOf('important') >= 0 || clsRaw.indexOf('performance') >= 0) cls = 'Important (Performance)';
else if (clsRaw.indexOf('value') >= 0 || clsRaw.indexOf('developmental') >= 0) cls = 'Value-Add (Developmental)';

var dept = (m['department'] || '').toString().trim();
var pos = (m['position'] || '').toString().trim();

if (!code || (code.toUpperCase().indexOf('CC') === 0)) { skipped++; return; } // Skip Core
if (!dept || !pos) { skipped++; return; } // Must have context

var key = code.toUpperCase() + '|' + dept.toUpperCase() + '|' + pos.toUpperCase();
var existing = expIndex[key];

if (existing) {
// UPDATE logic: Only queue if text or classification actually changed
if (existing.experience_text !== text || existing.classification !== cls) {
updates.push({ id: existing.id, experience_text: text, classification: cls });
expIndex[key].experience_text = text; // Prevent duplicate processing
}
} else {
// INSERT logic: New competency for this position
if (!text || !cls) { skipped++; return; }
inserts.push({
comp_code: code, experience_text: text, classification: cls,
department: dept, position_name: pos, competency_level: ''
});
expIndex[key] = { id: 'NEW' }; // Prevent duplicate inserts
}
});

// Execute Updates
for (var u of updates) {
const { error } = await _supabase.from('experiences').update({ experience_text: u.experience_text, classification: u.classification }).eq('id', u.id);
if (error) { showToast('Update error: ' + error.message); return; }
}
// Execute Inserts
if (inserts.length) {
const { error } = await _supabase.from('experiences').insert(inserts);
if (error) { showToast('Insert error: ' + error.message); return; }
}

await refreshCompData();
var msg = APP.user.name + ' bulk-synced the Competency Library: ' + inserts.length + ' added, ' + updates.length + ' updated, ' + skipped + ' skipped.';
notifyHR('Competency Library Bulk Sync', msg + ' Review in the CMS: ' + APP_LINK);
_supabase.from('user_profiles').select('email').eq('role', 'HEAD_HR').then(function(res){ (res.data || []).forEach(function(u){ sendCMSemail(u.email, 'Competency Library Bulk Sync', msg + ' Review in the CMS: ' + APP_LINK); }); });
showToast('✅ ' + inserts.length + ' added, ' + updates.length + ' updated, ' + skipped + ' skipped');
completeCompTasksFor(dep, pos);
if (document.getElementById('compContent')) loadCompDetail(); else if (document.getElementById('mgrCompContent')) loadMgrCompDetail();
} catch (err) { showToast('Upload failed: ' + err.message); }
input.value = '';
});
}

async function runAICheck(rows) {
if (!OPENROUTER_KEY || OPENROUTER_KEY.indexOf('PASTE') !== -1) return;
var ticked = rows.filter(function(r){ return r.ticked && r.evidence; });
if (!ticked.length) return;
var list = ticked.map(function(r, i){ return (i+1) + '. ' + r.experience_text + ' | Evidence: ' + r.evidence; }).join(String.fromCharCode(10));
var prompt = 'You are an HR quality auditor. For each numbered item, judge whether the evidence is RELEVANT to the experience described and specific enough for HR to approve (good), or IRRELEVANT/weak/vague (bad). Return ONLY valid JSON: {"flags":[{"i":1,"reason":"..."}]} listing ONLY the irrelevant or weak items. If all are relevant return {"flags":[]}. No markdown.';
try {
var text = await callAI(prompt + String.fromCharCode(10) + list, true);
if (!text) return;
var clean = text;
var s = clean.indexOf('{'); var e2 = clean.lastIndexOf('}');
if (s >= 0 && e2 > s) clean = clean.substring(s, e2 + 1);
var out = JSON.parse(clean);
var flags = out.flags || [];
if (!flags.length) return;
for (var f = 0; f < flags.length; f++) {
var idx = (flags[f].i || 0) - 1;
var row = ticked[idx];
if (!row) continue;
await _supabase.from('assessments').update({ ai_note: 'AI pre-check: ' + (flags[f].reason || 'evidence looks weak/vague') }).eq('assessment_id', row.assessment_id).eq('comp_code', row.comp_code).eq('experience_index', row.experience_index).eq('type', row.type);
}
notifyHR('AI Evidence Pre-Check: ' + flags.length + ' item(s) flagged', 'The AI pre-check flagged ' + flags.length + ' evidence item(s) as weak/vague in the latest ' + ticked[0].type + ' assessment for ' + ticked[0].employee_name + '. Nothing was rejected automatically — please review and decide: ' + APP_LINK);
} catch (err) { console.log('AI check skipped: ' + err.message); }
}

function doDownloadXLS(filename, tablesHtml) {
if (!window.XLSX) {
var html = '<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="UTF-8"><style>table{border-collapse:collapse;margin-bottom:16px;}td,th{border:1px solid #9aa5b1;vertical-align:top;padding:4px 6px;font-size:11px;font-family:Arial,sans-serif;}th{background:#e2e8f0;font-weight:bold;}</style></head><body>' + tablesHtml + '</body></html>';
var blob = new Blob(['\ufeff' + html], { type: 'application/vnd.ms-excel' });
var a = document.createElement('a');
a.href = URL.createObjectURL(blob);
a.download = filename;
document.body.appendChild(a);
a.click();
document.body.removeChild(a);
showToast('Excel downloaded');
return;
}
var holder = document.createElement('div');
holder.style.display = 'none';
holder.innerHTML = tablesHtml;
document.body.appendChild(holder);
var tables = holder.querySelectorAll('table');
var wb = XLSX.utils.book_new();
for (var i = 0; i < tables.length; i++) {
var ws = XLSX.utils.table_to_sheet(tables[i]);
var a1 = (ws['A1'] && ws['A1'].v) ? String(ws['A1'].v) : '';
var mm = a1.match(/^(SELF|MANAGER|PROSPECTIVE)\s+ASSESSMENT/i);
var name = tables.length === 1 ? 'All Assessments' : (mm ? (mm[1].charAt(0) + mm[1].slice(1).toLowerCase()) : (i === 0 ? 'Info' : (i === 1 ? 'Scores' : 'Sheet' + (i + 1))));
XLSX.utils.book_append_sheet(wb, ws, name);
}
document.body.removeChild(holder);
XLSX.writeFile(wb, filename.replace(/\.xls$/i, '') + '.xlsx');
showToast('Excel downloaded — opens with no warning');
}

async function emailReport(empId) {
if (!APP.user.modes.isAdmin) { showToast('Only HR Admin can email reports'); return; }
showToast('Preparing report...');
const { data: emp } = await _supabase.from('employees').select('*').eq('employee_id', empId).single();
if (!emp) { showToast('Employee not found'); return; }
const { data: allResults } = await _supabase.from('assessments').select('*').eq('employee_id', empId);
var rows = allResults || [];
var types = ['Self', 'Manager', 'Prospective'];
var L = [];
L.push('KENAFRIC CMS - COMPETENCY ASSESSMENT REPORT');
L.push('Employee: ' + emp.employee_name);
L.push('Position: ' + emp.position + ' | ' + (emp.department||'') + ' | ' + (emp.company||''));
L.push('Line Manager: ' + (emp.manager||'N/A'));
L.push('Generated: ' + new Date().toLocaleDateString('en-GB'));
L.push('');
L.push('=== SUMMARY ===');
types.forEach(function(type) {
var trs = rows.filter(function(r){ return r.type === type; });
var rounds = {};
trs.forEach(function(r){ var rd = r.assessment_round || 1; if (!rounds[rd]) rounds[rd] = []; rounds[rd].push(r); });
Object.keys(rounds).sort(function(a,b){ return a-b; }).forEach(function(rd) {
var fr = rounds[rd].map(function(r){ return { 'Employee ID': r.employee_id, 'Competency Code': r.comp_code, 'Type': r.type, 'Ticked': r.ticked, 'Evidence': r.evidence, 'HR_Status': r.hr_status, 'Rating': r.proficiency_rating }; });
var score = calculateOverallScore(empId, type, fr);
var label = type === 'Prospective' ? getProspectiveReadiness(score).label : getCurrentRoleReadiness(score).label;
L.push(type + ' | ' + ord(rd) + ' round | ' + (rounds[rd][0].assessment_date||'') + ' | ' + score + '% | ' + label);
});
});
L.push('');
types.forEach(function(type) {
var trs = rows.filter(function(r){ return r.type === type; });
if (!trs.length) return;
L.push('=== ' + type.toUpperCase() + ' ASSESSMENT ===');
trs.forEach(function(r) {
var ticked = r.ticked === true || r.ticked === 'TRUE' || r.ticked === 1;
L.push('- [' + (ticked ? 'DONE' : 'NOT DONE') + '] ' + (r.comp_name||r.comp_code) + ': ' + (r.experience_text||''));
L.push('   Classification: ' + (r.classification||''));
if (r.evidence) L.push('   Evidence: ' + r.evidence);
if (type !== 'Self') {
L.push('   HR Status: ' + (r.hr_status||'Pending'));
if (r.hr_comment) L.push('   HR Comment: ' + r.hr_comment);
}
});
});
sendCMSemail(APP.user.email, 'Assessment Report: ' + emp.employee_name, L.join(String.fromCharCode(10)));
}
