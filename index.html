async function pickFreeModels() {
  if (OR_MODEL_CACHE.length) return OR_MODEL_CACHE;

    var r = await fetch('https://openrouter.ai/api/v1/models');

      function pref(id) {
        var s = 0;
        if (id.indexOf('nemotron') >= 0) s += 8;

        if (id.indexOf('ultra') >= 0) s += 3;

async function callAI(prompt, wantJson) {
  if (!OPENROUTER_KEY || OPENROUTER_KEY.indexOf('PASTE') !== -1) {
    showToast('OpenRouter API key is missing');
    return '';
  }

  // Step 1: Try the free router first (auto-picks a working free model)
  try {
    var body = {
      model: 'openrouter/free',
      messages: [{ role: 'user', content: prompt }],
      temperature: 0.4
    };
    if (wantJson) body.response_format = { type: 'json_object' };
    var r = await fetch('https://openrouter.ai/api/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + OPENROUTER_KEY,
        'HTTP-Referer': 'https://cms.kenafricgroup.com',
        'X-Title': 'Kenafric CMS'
      },
      body: JSON.stringify(body)
    });
    if (r.ok) {
      var j = await r.json();
      if (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) {
        return cleanAI(j.choices[0].message.content);
      }
    } else {
      console.log('openrouter/free returned ' + r.status);
    }
  } catch (e) {
    console.log('openrouter/free fail: ' + e.message);
  }

  // Step 2: Fall back to dynamically-fetched free models
  var models = await pickFreeModels();
  for (var i = 0; i < Math.min(models.length, 4); i++) {
    try {
      var body2 = {
        model: models[i],
        messages: [{ role: 'user', content: prompt }],
        temperature: 0.4
      };
      if (wantJson) body2.response_format = { type: 'json_object' };
      var r2 = await fetch('https://openrouter.ai/api/v1/chat/completions', {
        method: 'POST',

          'Authorization': 'Bearer ' + OPENROUTER_KEY,
          'HTTP-Referer': 'https://cms.kenafricgroup.com',
          'X-Title': 'Kenafric CMS'
        },
        body: JSON.stringify(body2)
      });
      if (r2.ok) {
        var j2 = await r2.json();
        if (j2.choices && j2.choices[0] && j2.choices[0].message && j2.choices[0].message.content) {
          return cleanAI(j2.choices[0].message.content);
        }
      } else {
        console.log('OpenRouter ' + r2.status + ' on ' + models[i]);
      }
    } catch (e) {
      console.log('OpenRouter fail: ' + e.message);
    }
  }
  showToast('AI error — all models busy or unavailable');
  return '';
}

function avgCompScore(empId, code, fr) {
var s = calculateCompetencyScore(empId, code, 'Self', fr);
var m = calculateCompetencyScore(empId, code, 'Manager', fr);

if (s.total > 0) { sum += s.score; n++; }

function calculateCompetencyScore(empId, compCode, type, allResults) {
var rows = allResults.filter(function (r) { return r['Employee ID'] === empId && r['Competency Code'] === compCode && r['Type'] === type; });
if (rows.length === 0) return { score: 0, total: 0, valid: 0 };
var tiers = { critical: { total: 0, points: 0, valid: 0 }, important: { total: 0, points: 0, valid: 0 }, valueAdd: { total: 0, points: 0, valid: 0 } };
for (var i = 0; i < rows.length; i++) {
var r = rows[i];
var classification = (r['Classification'] || '').toString().trim();
var ticked = (r['Ticked'] === true || r['Ticked'] === 'TRUE' || r['Ticked'] === 1);
var evidence = (r['Evidence'] || '').toString().trim();
var hrStatus = (r['HR_Status'] || '').toString().trim();
var rating = parseFloat(r['Rating']);
var hasRating = (rating >= 1 && rating <= 5);
var isValid = (ticked && evidence !== '' && hrStatus !== 'Disapproved' && hasRating);
if (classification.indexOf('Critical') !== -1 || classification.indexOf('Must-Have') !== -1) { tiers.critical.total++; if (isValid) { tiers.critical.valid++; tiers.critical.points += rating / 5; } else { tiers.critical.points += cmsFloor(r) / 5; } }
else if (classification.indexOf('Important') !== -1 || classification.indexOf('Performance') !== -1) { tiers.important.total++; if (isValid) { tiers.important.valid++; tiers.important.points += rating / 5; } else { tiers.important.points += cmsFloor(r) / 5; } }
else { tiers.valueAdd.total++; if (isValid) { tiers.valueAdd.valid++; tiers.valueAdd.points += rating / 5; } else { tiers.valueAdd.points += cmsFloor(r) / 5; } }
}
var tierMax = tierMaximums(tiers);
var presentTiers = [];
['critical','important','valueAdd'].forEach(function(k){ if (tiers[k].total > 0) presentTiers.push(k); });
if (presentTiers.length === 0) return { score: 0, total: rows.length, valid: 0 };
var score = 0;
for (var t = 0; t < presentTiers.length; t++) {
var tierKey = presentTiers[t];
score += (tiers[tierKey].points / tiers[tierKey].total) * tierMax[tierKey];
}score = Math.round(score * 100) / 100;
return { score: score, total: rows.length, valid: tiers.critical.valid + tiers.important.valid + tiers.valueAdd.valid };
}
function calculateOverallScore(empId, type, allResults) {
var totalWeight = 0; var weightedScore = 0;

var w = parseFloat(comp.weight) || 0;
var cs = calculateCompetencyScore(empId, comp.code, type, allResults);
if (cs.total > 0) { totalWeight += w; weightedScore += Math.round((cs.score / 5) * 100) * w; }

}

async function finalizeReport(id) {
if (!await requireReportPair('report_chain',id)) return;
var c = document.getElementById('fin-' + id);
var comment = c ? c.value.trim() : '';
const { data: r } = await _supabase.from('report_chain').select('*').eq('id', id).single();
if (!r) return;
var newStatus = String(r.status || '').replace('Endorsed', 'Finalized');
const { error } = await _supabase.from('report_chain').update({ status: newStatus, stage: 'FINALIZED', comment: comment || r.comment, decided_by: APP.user.email, decided_date: new Date().toISOString().slice(0,10) }).eq('id', id);
if (error) { showToast(error.message); return; }
var decisionText = newStatus.replace('Finalized: ', '');
var NL = String.fromCharCode(10);
/* 1) HR Admin (who submitted the report) */
if (r.submitted_by) sendCMSemail(r.submitted_by, 'FINAL Decision: ' + r.employee_name + ' — ' + decisionText, 'The Head of HR has finalized the C-Suite endorsed decision for ' + r.employee_name + ' (' + (r.position || '') + '): ' + decisionText + '.' + NL + (r.comment ? 'C-Suite comment: ' + r.comment + NL : '') + (comment ? 'HOHR comment: ' + comment + NL : '') + 'Please proceed with the next steps in the CMS: ' + APP_LINK);
/* 2) Line Manager — the employee is NOT notified */
const { data: emp } = await _supabase.from('employees').select('manager_email').eq('employee_id', r.employee_id).single();
if (emp && emp.manager_email) {
if (decisionText.indexOf('Development Plan') >= 0) sendCMSemail(emp.manager_email, 'Development Plan Directed (FINAL): ' + r.employee_name, 'The C-Suite endorsed and the Head of HR finalized a DEVELOPMENT PLAN for ' + r.employee_name + '. Create the IDP from their gaps in the CMS: ' + APP_LINK);
else sendCMSemail(emp.manager_email, 'Promotion Approved (FINAL): ' + r.employee_name, r.employee_name + ' has been approved for promotion by the C-Suite and Head of HR (subject to vacancy and company process).');
}
showToast('✅ Finalized — HR Admin and Line Manager notified (employee not notified)');
loadHOHRReports();
}

function scoreBreakdownHTML(rows, type) {
var trs = (rows || []).filter(function(r){ return r.type === type; });
if (!trs.length) return '';
var tierNames = { critical: 'Critical', important: 'Important', valueAdd: 'Value-Add' };
var html = cmsRatingLegendHTML()+cmsPolicyNote(trs)+'<div class="card"><div class="card-title">🧮 Score Summary — ' + escapeHtml(type) + ' Assessment</div><div style="font-size:12px">';
var totalW = 0, sumWP = 0, num = 0;
for (var i = 0; i < APP.competencies.length; i++) {
var comp = APP.competencies[i];
var crs = trs.filter(function(r){ return r.comp_code === comp.code; });
if (!crs.length) continue;
num++;
var tiers = { critical: { n: 0, pts: 0 }, important: { n: 0, pts: 0 }, valueAdd: { n: 0, pts: 0 } };
crs.forEach(function(r) {
var t = getClassificationTier(r.classification);
var ticked = (r.ticked === true || r.ticked === 'TRUE' || r.ticked === 1);
var rating = parseFloat(r.proficiency_rating);
var hasEv = (r.evidence || '').toString().trim() !== '';
var ok = ticked && hasEv && rating >= 1 && rating <= 5 && r.hr_status !== 'Disapproved';
tiers[t].n++; tiers[t].pts += (ok ? rating : cmsFloor(r)) / 5;
});
var maxes = tierMaximums({ critical: { total: tiers.critical.n }, important: { total: tiers.important.n }, valueAdd: { total: tiers.valueAdd.n } });
var compScore = 0; var tierLine = [];
['critical','important','valueAdd'].forEach(function(t) {
if (tiers[t].n > 0) {
var s = (tiers[t].pts / tiers[t].n) * maxes[t];
compScore += s;
tierLine.push(tierNames[t] + ' ' + s.toFixed(2) + '/' + maxes[t].toFixed(2));
}
});
var pct = Math.round((compScore / 5) * 100);
var w = parseFloat(comp.weight) || 0;
totalW += w; sumWP += pct * w;
html += '<div style="padding:6px 0;border-bottom:1px dashed #e2e8f0">';
html += '<div style="display:flex;justify-content:space-between;gap:8px;font-weight:700"><span>' + num + '. ' + escapeHtml(comp.competency) + '</span><span style="color:var(--primary);white-space:nowrap">' + compScore.toFixed(2) + ' / 5 = ' + pct + '%</span></div>';
html += '<div style="color:var(--gray-500);font-size:11px;margin-top:2px">' + tierLine.join(' · ') + ' <span style="color:var(--gray-400)">(weight ' + w + '%)</span></div>';
html += '</div>';
}
var finalPct = totalW ? Math.round(sumWP / totalW) : 0;
html += '<div style="margin-top:10px;padding-top:8px;border-top:2px solid var(--gray-300);font-weight:800;font-size:13px">FINAL ' + type.toUpperCase() + ' SCORE = ' + Math.round(sumWP) + ' ÷ ' + Math.round(totalW) + ' = <span style="color:var(--primary)">' + finalPct + '%</span></div>';
html += '<div style="color:var(--gray-500);font-size:10px;margin-top:6px">How to read: "Critical 3.38/3.75" = of the 3.75 points reserved for Critical experiences, 3.38 were earned. Rules: ticked + evidence + rating = rating ÷ 5 points; missing evidence or rating = 1/5 under the new rule (protected legacy records keep their original floor); Critical counts more than Important, then Value‑Add.</div>';
html += '</div></div>';
return html;
}

function isOpComp(name){ var n=(name||'').toString().toUpperCase(); return n.indexOf('ANALYT')>=0 || n.indexOf('JUDG')>=0 || n.indexOf('DECISION')>=0 || n.indexOf('PLANN')>=0 || n.indexOf('EXEC')>=0; }
function isBehComp(name){ var n=(name||'').toString().toUpperCase(); return n.indexOf('LEARN')>=0 || n.indexOf('PEOPLE')>=0 || n.indexOf('LEADER')>=0; }
function compMinExps(name){ return isOpComp(name) ? 3 : (isBehComp(name) ? 2 : 0); }
function enforceFrameworkRules(comps){
var notes = [];
comps.forEach(function(c){
var min = compMinExps(c.name); var cnt = (c.experiences || []).length;
if (min && cnt < min) notes.push(c.name + ': needs at least ' + min + ' experiences (has ' + cnt + ') — add more below.');
});
var op = comps.filter(function(c){ return isOpComp(c.name); });
var beh = comps.filter(function(c){ return isBehComp(c.name); });
var total = comps.reduce(function(a,c){ return a + (parseFloat(c.weight)||0); }, 0);
var minOp = op.length ? Math.min.apply(null, op.map(function(c){ return parseFloat(c.weight)||0; })) : 0;
var maxBeh = beh.length ? Math.max.apply(null, beh.map(function(c){ return parseFloat(c.weight)||0; })) : 0;
if (op.length === 4 && beh.length === 3 && (minOp <= maxBeh || Math.round(total) !== 100)) {
op.forEach(function(c){ c.weight = 16; });
beh.forEach(function(c){ c.weight = 12; });
notes.push('Weights auto-set: first four 16% each, last three 12% each (total 100%).');
} else if (comps.length && Math.round(total) !== 100) {
var diff = Math.round((100 - total) * 100) / 100;
comps[comps.length - 1].weight = Math.round(((parseFloat(comps[comps.length - 1].weight)||0) + diff) * 100) / 100;
notes.push('Weights adjusted so the total is exactly 100%.');
}
return notes;
}

var rows = [], start = 0;
while (true) {
var result = await _supabase.from(table).select('*').order('id').range(start, start + 499);
if (result.error) throw result.error;
rows = rows.concat(result.data || []);
if (!result.data || result.data.length < 500) return rows;
start += 500;
}
}
var data = await Promise.all([allRows('competencies'), allRows('experiences')]);
APP.competencies = data[0]; APP.experiences = data[1];
}
function frameworkRows(review) {
return (APP.experiences || []).filter(function(x){ return review ? !frameworkApproved(x) : frameworkApproved(x); }).sort(function(a,b){ return compareCompetencyDisplay(a.comp_code,b.comp_code); });
}

h += '</div>';
});
});

var frameworkBusy = new Set();
async function saveFrameworkReview(id, values) {
if (!frameworkHR()) { showToast('Only HR Admin or Head of HR can review experiences'); return false; }
if (!Object.prototype.hasOwnProperty.call(values,'approval_status')) values=Object.assign({},values,{ai_note:null});
var row = (APP.experiences || []).find(function(x){ return x.id === id; });
if (!row || frameworkApproved(row)) { showToast('This item is no longer pending. Refresh the page.'); return false; }
if (frameworkBusy.has(id)) return false;
frameworkBusy.add(id);
try {
var query = _supabase.from('experiences').update(values).eq('id', id);
['approval_status','experience_text','classification','comp_code','department','position_name','competency_level'].forEach(function(key) {
query = row[key] == null ? query.is(key, null) : query.eq(key, row[key]);
});
var result = await query.select('id');
if (result.error) throw result.error;
if (!result.data || !result.data.length) { showToast('This experience changed elsewhere. Refresh and review it again.'); return false; }
Object.assign(row, values);
showToast(values.approval_status === 'Approved' ? 'Approved: now in the Library and available for assessments.' : 'Saved for HR review.');
await refreshFrameworkPage();
return true;
} catch (err) { showToast('Could not save: ' + (err.message || 'Please retry.')); return false; }
finally { frameworkBusy.delete(id); }
}
async function editFrameworkReview(id) {
if (!frameworkHR()) return;
var row = (APP.experiences || []).find(function(x){ return x.id === id; });
if (!row || frameworkApproved(row)) return;
var text = prompt('Edit experience statement:', row.experience_text || '');
if (text === null) return;
if (!text.trim()) { showToast('Experience text cannot be empty'); return; }
var cls = prompt('Classification: Must-Have (Critical), Important (Performance Enhancing), or Value-Add (Developmental)', row.classification || '');
if (cls === null) return;
if (!cls.trim()) { showToast('Classification is required'); return; }
if (await saveFrameworkReview(id, {experience_text:text.trim(),classification:cls.trim()})) await aiValidateExpById(id);
}
async function approveFrameworkReview(id) {
var row = (APP.experiences || []).find(function(x){ return x.id === id; });
if (!row || !frameworkHR()) return;
if (frameworkApproved(row)) { showToast('Already approved. No second approval is allowed.'); return; }
if (!(row.experience_text || '').trim() || !(APP.competencies || []).some(function(c){ return c.code === row.comp_code; })) { showToast('The experience needs text and a valid competency before approval.'); return; }
var check = await aiValidateExpById(id);
if (!check) { showToast('AI check unavailable. Review manually, then retry validation.'); return; }
if (check.flags.length && !confirm('AI flagged this experience. Review the flags and ideas shown below it. Approve this unchanged statement anyway?')) return;
await saveFrameworkReview(id, {approval_status:'Approved'});
}

async function runAICheck(rows) {
if (!OPENROUTER_KEY || OPENROUTER_KEY.indexOf('PASTE') !== -1) return;
var ticked = rows.filter(function(r){ return r.ticked && r.evidence; });
if (!ticked.length) return;
var list = ticked.map(function(r, i){ return (i+1) + '. ' + r.experience_text + ' | Evidence: ' + r.evidence; }).join(String.fromCharCode(10));
var prompt = 'You are an HR quality auditor. For each numbered item, judge whether the evidence is RELEVANT to the experience described and specific enough for HR to approve (good), or IRRELEVANT/weak/vague (bad). Return ONLY valid JSON: {"flags":[{"i":1,"reason":"..."}]} listing ONLY the irrelevant or weak items. If all are relevant return {"flags":[]}. No markdown.';
try {
var text = await callAI(prompt + String.fromCharCode(10) + list, true);
if (!text) return;
var clean = text;
var s = clean.indexOf('{'); var e2 = clean.lastIndexOf('}');
if (s >= 0 && e2 > s) clean = clean.substring(s, e2 + 1);
var out = JSON.parse(clean);
var flags = out.flags || [];
if (!flags.length) return;
for (var f = 0; f < flags.length; f++) {
var idx = (flags[f].i || 0) - 1;
var row = ticked[idx];
if (!row) continue;
await _supabase.from('assessments').update({ ai_note: 'AI pre-check: ' + (flags[f].reason || 'evidence looks weak/vague') }).eq('assessment_id', row.assessment_id).eq('comp_code', row.comp_code).eq('experience_index', row.experience_index).eq('type', row.type);
}
notifyHR('AI Evidence Pre-Check: ' + flags.length + ' item(s) flagged', 'The AI pre-check flagged ' + flags.length + ' evidence item(s) as weak/vague in the latest ' + ticked[0].type + ' assessment for ' + ticked[0].employee_name + '. Nothing was rejected automatically — please review and decide: ' + APP_LINK);
} catch (err) { console.log('AI check skipped: ' + err.message); }
}

<script>
/* ============ AI FRAMEWORK VALIDATOR — FLAGS ONLY, NEVER MODIFIES COMPETENCIES ============ */
var AI_FLAG_SEL = 'id, scope, ref_id, comp_code, department, position_name, check_type, severity, message, status, checked_by, checked_date';
function aiValRoles(){ return !!(APP.user && (APP.user.modes.isAdmin || APP.user.modes.isHOHR)); }
function fwPosExps(dep,pos){ return (APP.experiences||[]).filter(function(x){ return (x.comp_code||'').indexOf('CC')!==0 && sameText(x.department,dep) && sameText(x.position_name,pos); }); }
function fwCoreExps(){ return (APP.experiences||[]).filter(function(x){ return (x.comp_code||'').indexOf('CC')===0; }); }
function fwCompOf(code){ for (var i=0;i<(APP.competencies||[]).length;i++) if (APP.competencies[i].code===code) return APP.competencies[i]; return null; }

/* ---- Deterministic rule checks (no AI needed) ---- */
function deterministicChecks(dep,pos){
  var flags=[], posExps=fwPosExps(dep,pos), byCode={};
  posExps.forEach(function(x){ (byCode[x.comp_code]=byCode[x.comp_code]||[]).push(x); });
  (APP.competencies||[]).filter(function(c){ return (c.code||'').indexOf('CC')!==0; }).forEach(function(c){
    var n=(byCode[c.code]||[]).length, min=compMinExps(c.competency);
    if (!n) flags.push({scope:'competency',comp_code:c.code,check_type:'COVERAGE',severity:'high',message:c.competency+' has NO experiences set for '+pos+'.'});
    else if (min && n<min) flags.push({scope:'competency',comp_code:c.code,check_type:'MIN_COUNT',severity:'high',message:c.competency+' has '+n+' experience(s); minimum required is '+min+'.'});
  });
  var seen={};
  posExps.concat(fwCoreExps()).forEach(function(x){
    var t=(x.experience_text||'').trim(), key=t.toUpperCase();
    if (!t) return;
    if (!(x.classification||'').trim()) flags.push({scope:'experience',ref_id:x.id,comp_code:x.comp_code,check_type:'CLASSIFICATION',severity:'high',message:'No classification (Critical/Important/Value-Add): "'+t.slice(0,80)+'"'});
    if (t.indexOf('Has ')!==0) flags.push({scope:'experience',ref_id:x.id,comp_code:x.comp_code,check_type:'FORMAT',severity:'medium',message:'Experience should start with "Has " (past tense, observable): "'+t.slice(0,80)+'"'});
    if (t.length<40) flags.push({scope:'experience',ref_id:x.id,comp_code:x.comp_code,check_type:'CLARITY',severity:'medium',message:'Too short/vague to assess reliably: "'+t+'"'});
    if (seen[key]) flags.push({scope:'experience',ref_id:x.id,comp_code:x.comp_code,check_type:'DUPLICATE',severity:'medium',message:'Exact duplicate experience text also used under '+seen[key]+': "'+t.slice(0,80)+'"'});
    seen[key]=x.comp_code;
  });
  var core=(APP.competencies||[]).filter(function(c){ return (c.code||'').indexOf('CC')===0; });
  var func=(APP.competencies||[]).filter(function(c){ return (c.code||'').indexOf('CC')!==0; });
  var coreTot=0, funcTot=0;
  core.forEach(function(c){ var w=parseFloat(c.weight)||0; coreTot+=w; if (w!==7) flags.push({scope:'framework',comp_code:c.code,check_type:'WEIGHT',severity:'medium',message:'Core competency '+c.competency+' weight is '+w+'% (standard is 7%).'}); });
  func.forEach(function(c){ funcTot+=parseFloat(c.weight)||0; });
  if (Math.round(funcTot)!==72) flags.push({scope:'framework',check_type:'WEIGHT',severity:'high',message:'Functional weights total '+funcTot+'% — expected 72% (4 Core × 7% = 28%; grand total must be 100%).'});
  if (Math.round(coreTot+funcTot)!==100) flags.push({scope:'framework',check_type:'WEIGHT',severity:'high',message:'Core + Functional weights total '+(coreTot+funcTot)+'% — must equal exactly 100%.'});
  var op=func.filter(function(c){ return isOpComp(c.competency); }).map(function(c){ return parseFloat(c.weight)||0; });
  var beh=func.filter(function(c){ return isBehComp(c.competency); }).map(function(c){ return parseFloat(c.weight)||0; });
  if (op.length && beh.length && Math.min.apply(null,op) <= Math.max.apply(null,beh))
    flags.push({scope:'framework',check_type:'WEIGHT',severity:'medium',message:'Operational competencies (AT/JD/PL/EX = 12% each) must carry a HIGHER weight than behavioural ones (CL/PS/LD = 8% each).'});
  return flags;
}

/* ---- AI qualitative audit (returns flags only; explicitly forbidden to rewrite) ---- */
async function aiQualitativeChecks(dep,pos,exps){
  if (!exps.length) return [];
  var list=exps.map(function(x,i){ var m=fwCompOf(x.comp_code); return (i+1)+'. ['+(x.comp_code||'')+'] '+(m?m.competency:x.comp_code)+' | '+(x.classification||'no classification')+' | '+x.experience_text; }).join('\n');
  var prompt='You are an HR competency framework auditor. Position: "'+pos+'" (Department: "'+dep+'"). Below are the experiences configured per competency. Audit them and return ONLY valid JSON (no markdown): {"flags":[{"i":<item number>,"type":"OBSERVABILITY|MEASURABILITY|CLASSIFICATION_FIT|RELEVANCE|OVERLAP|CLARITY","severity":"high|medium|low","message":"<one sentence, plain English>"}]} listing ONLY problematic items. Checks: (a) observable, past-tense, provable behaviour; (b) specific/measurable enough for evidence and rating 1-5; (c) classification fits (Critical = must-have for the role, Important = performance enhancing, Value-Add = developmental); (d) relevant to this position and department; (e) two items in the same competency overlapping/duplicating; (f) wording too unclear to assess. If everything is fine return {"flags":[]}. NEVER rewrite or suggest new competency text — audit only.';
  try {
    var t=await callAI(prompt+'\n'+list, true);
    if (!t) return [];
    var s=t.indexOf('{'), e=t.lastIndexOf('}'); if (s>=0 && e>s) t=t.slice(s,e+1);
    var out=JSON.parse(t); var res=[];
    (out.flags||[]).forEach(function(f){
      var idx=(f.i||0)-1; if (idx<0 || idx>=exps.length) return;
      var x=exps[idx];
      res.push({ scope:'experience', ref_id:x.id, comp_code:x.comp_code, check_type:'AI_'+(f.type||'REVIEW'),
        severity:(String(f.severity||'medium').toLowerCase()), message:'[AI] '+(f.message||'')+' — "'+(x.experience_text||'').slice(0,80)+'"' });
    });
    return res;
  } catch(err){ console.log('AI validation skipped: '+err.message); return []; }
}

/* ---- Run + persist (inserts into comp_ai_flags ONLY — competencies untouched) ---- */
async function runAiValidation(dep,pos){
  if (!aiValRoles()) { showToast('Only HR Admin / Head of HR can run validation'); return; }
  if (!dep || !pos) { showToast('Select department and position first'); return; }
  showToast('🤖 AI is validating the framework...');
  var exps=fwPosExps(dep,pos);
  var flags=deterministicChecks(dep,pos).concat(await aiQualitativeChecks(dep,pos,exps));
  var today=new Date().toISOString().slice(0,10);
  flags.forEach(function(f){ f.status='Open'; f.checked_by=APP.user.email; f.checked_date=today; f.department=dep; f.position_name=pos; });
  window._aiFlagTemp=null;
  var del=await _supabase.from('comp_ai_flags').delete().eq('department',dep).eq('position_name',pos);
  if (del.error) { window._aiFlagTemp=flags; showToast('⚠️ Flags shown for this session only — run the comp_ai_flags SQL to persist them for HR & HOHR'); }
  else if (flags.length) {
    var ins=await _supabase.from('comp_ai_flags').insert(flags);
    if (ins.error) { window._aiFlagTemp=flags; showToast('⚠️ Could not save flags: '+ins.error.message); }
  }
  window._aiFlagLastRunMap=window._aiFlagLastRunMap||{}; window._aiFlagLastRunMap[dep+'|'+pos]=today;
  showToast(flags.length ? '🚩 '+flags.length+' flag(s) raised — nothing was changed' : '✅ No flags — framework looks compliant');
  appendAiValidationCard();
}
async function loadAiFlags(dep,pos){
  if (window._aiFlagTemp) return window._aiFlagTemp;
  var r=await _supabase.from('comp_ai_flags').select(AI_FLAG_SEL).eq('department',dep).eq('position_name',pos).order('id');
  return r.data||[];
}
async function dismissAiFlag(i){
  if (!aiValRoles()) return;
  var f=(window._aiFlagLastList||[])[i]; if (!f) return;
  f.status='Dismissed';
  if (f.id) await _supabase.from('comp_ai_flags').update({ status:'Dismissed' }).eq('id', f.id);
  appendAiValidationCard();
}
function sevBadge(s){ s=(s||'low').toLowerCase(); return s==='high'?'badge-danger':(s==='medium'?'badge-warning':'badge-info'); }
async function appendAiValidationCard(){
  if (!aiValRoles()) return;
  var depEl=document.getElementById('compDep')||document.getElementById('hohrCompDep');
  var posEl=document.getElementById('compPos')||document.getElementById('hohrCompPos');
  var box=document.getElementById('compContent')||document.getElementById('hohrCompContent');
  if (!depEl || !posEl || !box) return;
  var dep=depEl.value, pos=posEl.value;
  var old=document.getElementById('aiFlagCard'); if (old) old.remove();
  if (!dep || !pos) return;
  var flags=await loadAiFlags(dep,pos);
  var first=box.querySelector('.card');
  if (first) first.insertAdjacentHTML('beforebegin', aiFlagsCardHTML(dep,pos,flags));
  else box.insertAdjacentHTML('afterbegin', aiFlagsCardHTML(dep,pos,flags));
}
/* Hook into both library views (HR Admin + Head of HR) */
var _origLoadCompDetail2=loadCompDetail, _origLoadHOHRCompDetail2=loadHOHRCompDetail;
loadCompDetail=async function(){ await _origLoadCompDetail2(); appendAiValidationCard(); };
loadHOHRCompDetail=async function(){ await _origLoadHOHRCompDetail2(); appendAiValidationCard(); };
</script>
<script>
/* Whole-position framework workflow, v1.
 * Live content and drafts are separate database revisions.
 * Existing interface palette retained; one competency header carries its weight.
 */
var FW = { catalogue:null, revision:null, position:null, mode:null, dirty:false, busy:false, token:0 };
async function fwRPC(action,data) {
 var r=await _supabase.rpc('cms_framework',{p_action:action,p_data:data || {}});
 if(r.error) throw new Error(r.error.message);
 return r.data;
}
async function fwCatalogue() {
 var selectedMode = APP.currentRole;
 var c=await fwRPC('catalogue');
 if (APP.currentRole !== selectedMode) throw new Error('Role changed. Reopen the page.');
if (selectedMode === 'manager') {
  var scope = await _supabase.rpc('cms_my_manager_positions');
  if (scope.error) throw new Error(scope.error.message);
  if (APP.currentRole !== selectedMode) {
    throw new Error('Role changed. Reopen Set Competencies.');
  }
  var managedIds = new Set(scope.data || []);
  c.positions = (c.positions || []).map(function(p) {
    return Object.assign({}, p, {can_edit: managedIds.has(p.id)});
  });
}
 FW.catalogue=c;
 APP.competencies=c.competencies || [];
 APP.experiences=(c.positions || []).flatMap(function(p){
  return (p.items || []).map(function(i){return {id:i.id,comp_code:i.code,experience_text:i.text,
   classification:i.classification,competency_level:i.level,department:p.department,
   position_name:p.position,approval_status:'Approved',ai_note:i.ai_note};});
 });
 return c;
}
fetchFrameworkForReview=fwCatalogue;
refreshCompData=fwCatalogue;
function fwIsReviewer(){return !!(FW.catalogue && FW.catalogue.reviewer && (APP.currentRole==='hr' || APP.currentRole==='hohr'));}
function fwLabel(p){return p.department ? p.department+' / '+p.position : 'Company-wide Core';}
function fwPosition(dep,pos){return (FW.catalogue && FW.catalogue.positions || []).find(function(p){return sameText(p.department,dep)&&sameText(p.position,pos);});}
function fwCore(){return fwPosition('','');}
function fwMinimums(r) {
 var out=[],items=r.items || [],p=FW.position;
 if(p && !p.department) {
  var baseline=p.items || [];
  baseline.forEach(function(i){if(!items.some(function(x){return x.code===i.code && x.level===i.level && (x.text || '').trim();}))out.push(i.code+' / '+i.level+' needs an experience');});
 } else {
  [['FC001',3],['FC002',3],['FC003',3],['FC004',3],['FC005',2],['PC001',2],['LC001',2]].forEach(function(pair){
   var n=items.filter(function(i){return i.code===pair[0] && (i.text || '').trim() && i.classification;}).length;
   if(n<pair[1])out.push(compNameOf(pair[0])+': '+n+'/'+pair[1]);
  });
 }
 if(items.some(function(i){return !(i.text || '').trim() || !i.classification;}))out.push('Complete or remove every empty optional experience');
 return Array.from(new Set(out));
}
async function fwOpen(mode) {
 if(FW.busy){showToast('Please wait for the current framework operation.');return;}
 if(FW.dirty && !confirm('Leave without saving this framework draft?'))return;
 var token=++FW.token; FW.mode=mode;FW.revision=null;FW.position=null;FW.dirty=false;
 setContent('<div class="card"><p>Loading published frameworks...</p></div>');
 try {
  await fwCatalogue();if(token!==FW.token)return;
  if(mode==='review' && !fwIsReviewer())throw new Error('HR Admin or HOHR framework permission is required.');
  var title=mode==='library'?'Competency Library':mode==='review'?'Competency Approvals & Publication':'Set Competencies';
  var h='<div id="fwScreen" class="card"><div class="card-title">'+title+'</div>';
  h+='<p style="margin-bottom:12px">'+(mode==='library'?'Published content only. A draft never replaces a live framework.':mode==='review'?'Approve each experience, then publish the complete position in one action.':'Save a private draft. Submit only when all seven competency minimums are complete.')+'</p>';
  h+='<div id="fwChoice"></div><div id="fwBody" style="margin-top:16px"></div></div>';
  setContent(h);
  if(mode==='review'){
   var queue=await fwRPC('queue');if(token!==FW.token)return;
   var sel=document.createElement('select');sel.id='fwRevisionChoice';
   sel.innerHTML='<option value="">Select submitted framework ('+queue.length+')</option>'+queue.map(function(r){return '<option value="'+escapeHtml(r.id)+'">'+escapeHtml(fwLabel(r))+'</option>';}).join('');
   sel.onchange=async function(){if(!sel.value)return;try{FW.revision=await fwRPC('get',{id:sel.value});FW.position=FW.catalogue.positions.find(p=>p.id===FW.revision.position_id);fwRenderRevision();}catch(e){showToast(e.message);}};
   document.getElementById('fwChoice').appendChild(sel);
   if(!queue.length)document.getElementById('fwBody').textContent='No submitted frameworks. Private drafts do not appear here.';
  }else{
   var positions=FW.catalogue.positions.filter(function(p){
    if(mode==='library') return !!p.live_version && (APP.currentRole!=='manager' || p.can_edit);
    return p.can_edit;
   });
   var sel=document.createElement('select');sel.id='fwPositionChoice';
   sel.innerHTML='<option value="">Select department and position</option>'+positions.map(function(p){return '<option value="'+escapeHtml(p.id)+'">'+escapeHtml(fwLabel(p))+'</option>';}).join('');
   sel.onchange=async function(){
    if(FW.dirty&&!confirm('Discard unsaved draft edits?')){sel.value=FW.position.id;return;}
    FW.dirty=false;FW.revision=null;FW.position=positions.find(p=>p.id===sel.value);
    if(!FW.position){document.getElementById('fwBody').innerHTML='';return;}
    if(mode==='library')fwRenderLibrary();
    else try{FW.revision=await fwRPC('open',{position_id:FW.position.id});if(FW.revision)fwRenderRevision();else fwStartCard();}catch(e){document.getElementById('fwBody').textContent=e.message;}
   };document.getElementById('fwChoice').appendChild(sel);
  }
 }catch(e){setContent('<div class="card"><p>'+escapeHtml(e.message)+'</p><p>Install the publication SQL first and check the private reviewer/roster setup.</p></div>');}
}
function fwStartCard(){
 document.getElementById('fwBody').innerHTML='<p>'+(FW.position.live_version?'The published version stays live while you revise it.':'No published framework yet: assessments remain locked.')+'</p><button class="btn btn-primary" onclick="fwStart()">Start private revision</button>';
}
async function fwStart(){
 if(FW.busy)return;FW.busy=true;
 try{FW.revision=await fwRPC('start',{position_id:FW.position.id});FW.dirty=false;fwRenderRevision();}catch(e){showToast(e.message);}finally{FW.busy=false;fwButtons();}
}
function fwGroups(items){
 var map=new Map();items.forEach(i=>{if(!map.has(i.code))map.set(i.code,[]);map.get(i.code).push(i);});
 return Array.from(map.keys()).sort(compareCompetencyDisplay).map(code=>({code,items:map.get(code)}));
}
function fwHeading(code){
 var c=APP.competencies.find(c=>c.code===code) || {};
 return '<div class="competency-header"><strong>'+escapeHtml(c.competency || code)+'</strong><span>'+escapeHtml(c.category || '')+' | '+weightPct(c.weight || 0)+'% for this competency</span></div>';
}
function fwRenderLibrary(){
 var p=FW.position,items=(p.items || []).slice();
 if(p.department && fwCore())items=items.concat(fwCore().items || []);
 var h='<h3>'+escapeHtml(fwLabel(p))+'</h3>';
 fwGroups(items).forEach(g=>{
  h+='<section class="competency-block">'+fwHeading(g.code);
  g.items.forEach(i=>{h+='<div class="exp-item"><p>'+escapeHtml(i.text)+' '+getClassificationBadge(i.classification)+'</p>'+(i.level?'<span class="badge badge-info">'+escapeHtml(i.level)+'</span>':'')+'</div>';});
  h+='</section>';
 });
 if(p.can_edit)h+='<button class="btn btn-outline" onclick="fwStart()">Edit in a separate revision</button>';
 document.getElementById('fwBody').innerHTML=h;
}
function fwRenderRevision(){
 var r=FW.revision,p=FW.position; if(!r || !p)return;
 var draft=r.state==='Draft',review=r.state==='Submitted' && fwIsReviewer();
 if(draft && p.department){
  [['FC001',3],['FC002',3],['FC003',3],['FC004',3],['FC005',2],['PC001',2],['LC001',2]].forEach(function(pair){
   var existing=r.items.filter(i=>i.code===pair[0]).length;
   for(var slot=existing;slot<pair[1];slot++){
    r.items.push({id:crypto.randomUUID(),code:pair[0],text:'',classification:'Important (Performance Enhancing)',level:'',ai_note:null});
    FW.dirty=true;
   }
  });
 }
 var items=r.items || [];
 var codes=p.department?['FC001','FC002','FC003','FC004','FC005','PC001','LC001']:
  APP.competencies.filter(c=>c.code.indexOf('CC')===0).map(c=>c.code);
 items.forEach(i=>{if(!codes.includes(i.code))codes.push(i.code);});codes.sort(compareCompetencyDisplay);
 var h='<h3>'+escapeHtml(fwLabel(p))+'</h3><p><strong>'+escapeHtml(r.state)+'</strong> | '+(p.live_version?'Existing published version remains available.':'Assessments locked until publication.')+'</p>';
 codes.forEach(code=>{

  if(nonnull.length)parts.push(field+'.in.('+nonnull.map(v=>JSON.stringify(v)).join(',')+')');
  if(!parts.length)parts.push(field+'.eq.'+JSON.stringify(EB[field]));
  clauses.push(parts.length>1?'or('+parts.join(',')+')':parts[0]);
 });
 if(clauses.length)q=q.or('and('+clauses.join(',')+')');
 if(EB.track)q=q.eq('talent_track',EB.track);
 if(EB.search)q=q.ilike('employee_name','%'+ebLike(EB.search)+'%');
 return q;

async function xiRPC(action,data){
 var r=await _supabase.rpc('cms_executive_detail',{p_action:action,p_data:data||{}});
 if(r.error)throw new Error(r.error.message);return r.data;
}
function xiScope(){return {company:XI.company,department:XI.department,position:XI.position,page:XI.page,search:XI.search,track:XI.track};}
function xiNode(tag,text,cls){var n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n;}
function xiPct(v){return v===null||v===undefined?'Not assessed':v+'%';}
function xiTable(host,headers,rows){
 var wrap=xiNode('div',undefined,'xi-table'),table=document.createElement('table'),head=document.createElement('thead'),hr=document.createElement('tr'),body=document.createElement('tbody');
 headers.forEach(x=>hr.appendChild(xiNode('th',x)));head.appendChild(hr);table.appendChild(head);
 rows.forEach(function(row){var tr=document.createElement('tr');row.forEach(function(v){var td=document.createElement('td');if(v instanceof Node)td.appendChild(v);else td.textContent=v==null?'Not recorded':String(v);tr.appendChild(td);});body.appendChild(tr);});
 table.appendChild(body);wrap.appendChild(table);host.appendChild(wrap);if(!rows.length)host.appendChild(xiNode('p','No matching records.','xm-fine'));return table;
}
function xiMetrics(host,list){
 var grid=xiNode('div',undefined,'xi-metrics');list.forEach(function(x){var card=exPanel(x[0]);card.appendChild(xiNode('div',x[1]===null?'Not assessed':x[1],'xi-number'));if(x[2])card.appendChild(xiNode('p',x[2],'xm-fine'));grid.appendChild(card);});host.appendChild(grid);
}
var XI_TABS=[['snapshot','Group Snapshot'],['companies','Companies & Departments'],['succession','Succession & Critical Roles'],['talent','Talent Pools'],['development','Development Plans'],['competencies','Competency Rankings'],['frameworks','Competency Library'],['reports','Monthly Reports']];
function xiHeader(){
 var root=exShell('Executive Overview'),content=root.querySelector('#exContent');content.innerHTML='';
 var header=root.querySelector('.xm-head');if(header)header.classList.add('xi-hero');
 var nav=xiNode('div',undefined,'xi-tabs');XI_TABS.forEach(function(pair){var b=exButton(pair[1],()=>{XI.tab=pair[0];XI.page=0;xiOpen();});b.classList.toggle('active',XI.tab===pair[0]);nav.appendChild(b);});content.appendChild(nav);
 var filters=xiNode('div',undefined,'xm-filters');filters.id='xiFilters';content.appendChild(filters);
 var body=xiNode('div','Loading details…');body.id='xiBody';content.appendChild(body);
 return {root,body,filters};
}
async function xiOpen(){
 var token=++XI.token;EX.token++;var role=APP.currentRole,view=xiHeader();
 try{
  var d=await xiRPC('overview',xiScope());
  if(token!==XI.token||role!==APP.currentRole||document.getElementById('exRoot')!==view.root)return;
  XI.data=d;
  [['company','Company',d.filters.companies],['department','Department',d.filters.departments],['position','Position',d.filters.positions]].forEach(function(v){
   var sel=document.createElement('select');sel.setAttribute('aria-label',v[1]);sel.add(new Option(v[1]+': All',''));(v[2]||[]).slice().sort().forEach(x=>sel.add(new Option(x,x)));sel.value=XI[v[0]];
   sel.onchange=()=>{XI[v[0]]=sel.value;XI.page=0;xiOpen();};view.filters.appendChild(sel);
  });view.filters.appendChild(exButton('Refresh',()=>xiOpen()));
  view.body.innerHTML='';
  var active=()=>token===XI.token&&role===APP.currentRole&&document.getElementById('exRoot')===view.root;
  if(XI.tab==='snapshot')xiSnapshot(view.body,d);
  if(XI.tab==='competencies')xiRanking(view.body,d);
  if(XI.tab==='companies'){
   var card=exPanel('Company workforce scorecards');xiCompanyTable(card,d);view.body.appendChild(card);

  }

  if(XI.tab==='development')await xiDevelopment(view.body,active);
  if(XI.tab==='frameworks')await xiFrameworks(view.body,active);

  if(active())view.body.appendChild(xiNode('p','Latest submitted assessment rounds • Updated '+new Date(d.as_of).toLocaleString()+' • Private decisions are excluded from shared views.','xm-footer'));
 }catch(e){if(document.getElementById('exRoot')===view.root){view.body.textContent='Could not load this section: '+e.message;view.body.appendChild(exButton('Retry',xiOpen));}}
}
function xiExtremes(d){
 var valid=d.ranking.filter(r=>r.score!==null&&r.assessed>0),hi=valid.length?Math.max(...valid.map(r=>Number(r.score))):null,lo=valid.length?Math.min(...valid.map(r=>Number(r.score))):null;
 return {highest:valid.filter(r=>Number(r.score)===hi),lowest:valid.filter(r=>Number(r.score)===lo),hi,lo};
}
function xiSnapshot(host,d){
 var uncovered=d.critical_roles.filter(r=>!r.ready_successors).length;
 xiMetrics(host,[['Employees',d.employees],['Complete assessment pairs',d.complete_pairs],['People in development',d.development.people,'Unique people, not actions'],['Critical roles without ready nominees',uncovered,'Recorded occupied roles only']]);

<script>
/* SOP controls v2: critical-experience gates (70% Manager + 30% Self),
   critical-roles-first succession, calibration review.
   Gate detail is never rendered for the employee role. */
var CG = { current: 80, prospective: 70, cache: {} };
function cgIsCritical(c){ c = (c || '').toString(); return c.indexOf('Critical') !== -1 || c.indexOf('Must-Have') !== -1; }
function cgRate(r){ var v = parseFloat(r.proficiency_rating); return (v >= 1 && v <= 5) ? v : null; }
function cgTicked(r){ return r.ticked === true || r.ticked === 'TRUE' || r.ticked === 1; }
function cgUsable(r){ return cgTicked(r) && (r.evidence || '').toString().trim() !== '' && (r.hr_status || '') !== 'Disapproved' && cgRate(r) !== null; }
function cgKey(r){ return (r.comp_code || '') + '#' + (r.experience_index == null ? '' : r.experience_index); }
function cgLatest(rows, type){
 var f = (rows || []).filter(function(r){ return r.type === type; });
 if (!f.length) return [];
 var max = 0; f.forEach(function(r){ var rd = r.assessment_round || 1; if (rd > max) max = rd; });
 return f.filter(function(r){ return (r.assessment_round || 1) === max; });
}
function cgEvaluate(rows, kind){
 var threshold = kind === 'current' ? CG.current : CG.prospective;
 var mgrType = kind === 'current' ? 'Manager' : 'Prospective';
 var selfType = kind === 'current' ? 'Self' : 'Prospective Self';
 var mgr = cgLatest(rows, mgrType), slf = cgLatest(rows, selfType);
 var out = { kind: kind, threshold: threshold, items: [], failed: 0, awaiting: 0, state: 'awaiting', note: '' };
 if (!mgr.length) { out.note = 'Awaiting ' + (kind === 'current' ? 'manager assessment' : 'prospective role assessment') + '.'; return out; }
 if (!slf.length) { out.note = 'Awaiting ' + (kind === 'current' ? 'self assessment' : 'prospective self assessment') + ' — the gate needs both scores.'; return out; }
 var mv = mgr[0].framework_version || null, sv = slf[0].framework_version || null;
 if (mv && sv && mv !== sv) { out.state = 'mismatch'; out.note = 'Self and manager assessments used different published framework versions. Reassess against the current framework before deciding.'; return out; }
 if (!mv || !sv) out.note = 'Legacy assessment: no stored framework version, so item matching relies on competency and experience order.';
 var selfBy = {}; slf.forEach(function(r){ selfBy[cgKey(r)] = r; });
 mgr.forEach(function(r){
  if (!cgIsCritical(r.classification)) return;
  var s = selfBy[cgKey(r)];
  var item = { comp: r.comp_name || r.comp_code, text: r.experience_text || '', mgr: null, self: null, combined: null, ok: false, why: '' };
  if (!s) { item.why = 'No matching self-assessment item'; out.awaiting++; out.items.push(item); return; }
  if (!cgUsable(r) || !cgUsable(s)) {
   item.why = !cgUsable(r) ? 'Manager: not demonstrated, no evidence or no rating' : 'Self: not demonstrated, no evidence or no rating';
   item.mgr=Math.round(cmsEffectiveRating(r)/5*100);item.self=Math.round(cmsEffectiveRating(s)/5*100);item.combined=Math.round(.7*item.mgr+.3*item.self);
   out.failed++; out.items.push(item); return;
  }
  item.mgr = Math.round(cgRate(r) / 5 * 100); item.self = Math.round(cgRate(s) / 5 * 100);
  item.combined = Math.round(item.mgr * 0.7 + item.self * 0.3);
  item.ok = item.combined >= threshold;
  if (!item.ok) { out.failed++; item.why = 'Below the ' + threshold + '% minimum'; }
  out.items.push(item);
 });
 if (!out.items.length) { out.state = 'none'; out.note = 'No Must-Have (Critical) experiences are configured for this role.'; return out; }
 out.state = (out.failed === 0 && out.awaiting === 0) ? 'pass' : (out.awaiting && !out.failed ? 'awaiting' : 'fail');
 return out;
}
function cgHidden(){ return !APP || !APP.currentRole || APP.currentRole === 'employee'; }
function cgBadge(g){
 if (g.state === 'pass') return '<span class="badge badge-success">Critical requirement met (every item ' + g.threshold + '%+)</span>';
 if (g.state === 'fail') return '<span class="badge badge-danger">Critical requirement NOT met — ' + g.failed + ' item(s) below ' + g.threshold + '%</span>';
 if (g.state === 'mismatch') return '<span class="badge badge-danger">Framework version mismatch</span>';
 if (g.state === 'none') return '<span class="badge badge-gray">No critical experiences configured</span>';
 return '<span class="badge badge-warning">Pending — awaiting assessment or evidence</span>';
}
function cgPanel(g, title){
 if (cgHidden()) return '';
 var h = '<div class="card"><div class="card-title">' + title + '</div><div style="margin-bottom:8px">' + cgBadge(g) + '</div>';
 h += '<p style="font-size:11px;color:var(--gray-500)">Each Must-Have (Critical) experience must reach ' + g.threshold + '% on its own, scored 70% manager + 30% self. Not shown on the employee\'s own pages.</p>';
 if (g.note) h += '<p style="font-size:11px;color:var(--orange)">' + escapeHtml(g.note) + '</p>';
 if (g.items.length) {
  h += '<div class="table-wrap"><table><thead><tr><th>Competency</th><th>Critical experience</th><th>Manager</th><th>Self</th><th>70/30</th><th>Result</th></tr></thead><tbody>';
  g.items.forEach(function(i){
   h += '<tr><td style="font-size:11px">' + escapeHtml(i.comp) + '</td><td style="font-size:11px">' + escapeHtml((i.text || '').slice(0, 120)) + '</td>';
   h += '<td>' + (i.mgr == null ? '—' : i.mgr + '%') + '</td><td>' + (i.self == null ? '—' : i.self + '%') + '</td>';
   h += '<td><strong>' + (i.combined == null ? '—' : i.combined + '%') + '</strong></td>';
   h += '<td>' + (i.ok ? '<span class="badge badge-success">Met</span>' : '<span class="badge badge-danger">' + escapeHtml(i.why || 'Not met') + '</span>') + '</td></tr>';
  });
  h += '</tbody></table></div>';
 }
 h += '</div>';
 return h;
}
async function cgRows(empId){
 if (CG.cache[empId]) return CG.cache[empId];
 var q = await _supabase.from('assessments')
  .select('employee_id,type,comp_code,comp_name,experience_index,experience_text,classification,ticked,evidence,proficiency_rating,hr_status,scoring_rule,assessment_round,framework_version,prospective_role')

 CG.cache[empId] = q.data || [];

/* ---- Calibration review (analysis only; sign-off storage not yet added) ---- */
async function loadHRCalibration(){
var __cmsRouteEpoch = typeof CN === 'undefined' ? null : CN.epoch;

 ((typeof CN === 'undefined' || __cmsRouteEpoch === CN.epoch) ? setContent('<div class="loading"><div class="spinner"></div>Loading calibration data...</div>') : undefined);
 try {
  var emps = await _supabase.from('employees').select('employee_id,employee_name,department,company,position,manager');
  if (emps.error) throw new Error(emps.error.message);
  var rows = [], from = 0;
  for (;;) {
   var q = await _supabase.from('assessments').select('employee_id,type,comp_code,classification,ticked,evidence,proficiency_rating,hr_status,scoring_rule,assessment_round').range(from, from + 999);
   if (q.error) throw new Error(q.error.message);
   rows = rows.concat(q.data || []);
   if (!q.data || q.data.length < 1000) break;
   from += 1000;
  }
  var byEmp = {};
  rows.forEach(function(r){ (byEmp[r.employee_id] = byEmp[r.employee_id] || []).push(r); });
  var people = [];
  (emps.data || []).forEach(function(e){
   var er = byEmp[e.employee_id]; if (!er) return;
   var fr = er.map(function(r){ return { 'Employee ID': r.employee_id, 'Competency Code': r.comp_code, 'Type': r.type, 'Ticked': r.ticked, 'Evidence': r.evidence, 'HR_Status': r.hr_status, 'Rating': r.proficiency_rating, 'Classification': r.classification , 'Scoring Rule': r.scoring_rule || 'legacy-zero'}; });
   var hasM = er.some(function(r){ return r.type === 'Manager'; });
   var hasS = er.some(function(r){ return r.type === 'Self'; });
   if (!hasM || !hasS) return;
   var m = calculateOverallScore(e.employee_id, 'Manager', fr);
   var sc = calculateOverallScore(e.employee_id, 'Self', fr);
   people.push({ dep: e.department || 'Unassigned', company: e.company || '', name: e.employee_name, position: e.position, manager: e.manager || '', m: m, s: sc, d: sc - m, combined: Math.round(m * 0.7 + sc * 0.3) });
  });

  html += '<p style="font-size:12px;color:var(--gray-500)">Compare standards across departments and managers before talent decisions. Only employees with BOTH a self and a manager assessment appear. Scores use the latest submitted rounds.</p>';
  if (!people.length) { html += '<p style="color:var(--gray-500)">No employee has both assessments yet.</p></div>'; ((typeof CN === 'undefined' || __cmsRouteEpoch === CN.epoch) ? setContent(html) : undefined); return; }
  var all = people.reduce(function(a,p){ return a + p.combined; }, 0) / people.length;
  html += '<div class="stats-grid"><div class="stat-card"><div class="num">' + people.length + '</div><div class="lbl">Calibratable employees</div></div>';
  html += '<div class="stat-card"><div class="num">' + Math.round(all) + '%</div><div class="lbl">Company average (70/30)</div></div>';
  html += '<div class="stat-card"><div class="num">' + people.filter(function(p){ return p.d >= 20; }).length + '</div><div class="lbl">Self exceeds manager by 20%+</div></div>';
  html += '<div class="stat-card"><div class="num">' + people.filter(function(p){ return p.m >= 90; }).length + '</div><div class="lbl">Manager scores 90%+</div></div></div>';
  var deps = {};
  people.forEach(function(p){ (deps[p.dep] = deps[p.dep] || []).push(p); });
  html += '<div class="table-wrap"><table><thead><tr><th>Department</th><th>People</th><th>Avg manager</th><th>Avg self</th><th>Avg 70/30</th><th>vs company</th><th>Strong 80%+</th><th>Below 60%</th><th>Flag</th></tr></thead><tbody>';
  Object.keys(deps).sort().forEach(function(d){
   var g = deps[d], n = g.length;
   var am = Math.round(g.reduce(function(a,p){ return a + p.m; }, 0) / n);
   var as = Math.round(g.reduce(function(a,p){ return a + p.s; }, 0) / n);
   var ac = Math.round(g.reduce(function(a,p){ return a + p.combined; }, 0) / n);
   var diff = ac - Math.round(all);
   var strong = g.filter(function(p){ return p.combined >= 80; }).length;
   var low = g.filter(function(p){ return p.combined < 60; }).length;
   var flags = [];
   if (Math.abs(diff) >= 10) flags.push(diff > 0 ? 'Possible inflation' : 'Possible severity');

   html += '<tr><td><strong>' + escapeHtml(d) + '</strong></td><td>' + n + '</td><td>' + am + '%</td><td>' + as + '%</td><td><strong>' + ac + '%</strong></td>';
   html += '<td style="color:' + (Math.abs(diff) >= 10 ? 'var(--red)' : 'var(--gray-600)') + '">' + (diff > 0 ? '+' : '') + diff + '</td><td>' + strong + '</td><td>' + low + '</td>';
   html += '<td style="font-size:11px">' + (flags.length ? escapeHtml(flags.join('; ')) : '—') + '</td></tr>';
  });
  html += '</tbody></table></div></div>';
  var wide = people.filter(function(p){ return Math.abs(p.d) >= 20; }).sort(function(a,b){ return Math.abs(b.d) - Math.abs(a.d); });
  html += '<div class="card"><div class="card-title">Largest self vs manager differences</div>';

   html += '<div class="table-wrap"><table><thead><tr><th>Employee</th><th>Department</th><th>Line manager</th><th>Self</th><th>Manager</th><th>Difference</th></tr></thead><tbody>';
   wide.slice(0, 25).forEach(function(p){
    html += '<tr><td style="font-size:11px"><strong>' + escapeHtml(p.name) + '</strong><br><span style="color:var(--gray-400)">' + escapeHtml(p.position || '') + '</span></td><td style="font-size:11px">' + escapeHtml(p.dep) + '</td><td style="font-size:11px">' + escapeHtml(p.manager) + '</td><td>' + p.s + '%</td><td>' + p.m + '%</td><td style="font-weight:700;color:' + (p.d > 0 ? 'var(--orange)' : 'var(--primary)') + '">' + (p.d > 0 ? '+' : '') + p.d + '</td></tr>';
   });
   html += '</tbody></table></div>';
  }
  html += '</div>';
  html += '<div class="card"><p style="font-size:12px;color:var(--gray-600)"><strong>Process:</strong> manager assessment → HR review → calibration (this page) → talent decision → succession → promotion only with readiness, sustained performance, a vacancy and approval.</p>';
  html += '<p style="font-size:11px;color:var(--orange)">This page analyses current data only. Recording a calibration sign-off, attendees and agreed adjustments needs a small database table, which is not installed yet.</p></div>';
  ((typeof CN === 'undefined' || __cmsRouteEpoch === CN.epoch) ? setContent(html) : undefined);
 } catch (e) {
  ((typeof CN === 'undefined' || __cmsRouteEpoch === CN.epoch) ? setContent('<div class="card"><h3>Calibration unavailable</h3><p>' + escapeHtml(e.message) + '</p></div>') : undefined);
 }
}

 var cgOrigLoadPage = loadPage;
 loadPage = function(id){ if (id === 'hr-calibration') return loadHRCalibration(); return cgOrigLoadPage(id); };

<script>
/* ===== AI EXPERIENCE LIBRARY + PROGRESS DASHBOARD + INLINE SUGGEST ===== */

/* ---------- 1. AI Library: data layer ---------- */
var AILib = { cache: {}, dep: null, pos: null, code: null };

function aiLibKey(dep, pos, code) { return dep + '|' + pos + '|' + code; }

async function aiLibFetch(dep, pos, code) {
  var key = aiLibKey(dep, pos, code);
  if (AILib.cache[key]) return AILib.cache[key];
  var r = await _supabase.from('ai_experience_library')
    .select('*')
    .eq('department', dep)
    .eq('position_name', pos)
    .eq('comp_code', code)
    .order('id');
  if (r.error) throw new Error(r.error.message);
  AILib.cache[key] = r.data || [];
  return AILib.cache[key];
}

async function aiLibGenerate(dep, pos, code) {
  var comp = (APP.competencies || []).find(function(c) { return c.code === code; });
  var compName = comp ? comp.competency : code;
  var existing = await aiLibFetch(dep, pos, code);
  var existingText = existing.map(function(e) { return '- ' + e.experience_text; }).join('\n');

  var prompt = 'You are an HR competency framework expert for a manufacturing/FMCG company in East Africa. ' +
    'Generate exactly 5 observable, assessable experiences for:\n' +
    'Position: "' + pos + '"\nDepartment: "' + dep + '"\nCompetency: "' + compName + '" (' + code + ')\n\n' +
    'Rules:\n' +
    '- Each experience MUST start with "Has " (past tense, observable behaviour)\n' +
    '- Must be specific enough for a manager to rate 1-5 and for an employee to provide evidence\n' +
    '- Must be relevant to this specific position and department\n' +
    '- Classify each as: Must-Have (Critical), Important (Performance Enhancing), or Value-Add (Developmental)\n' +
    '- At least 2 should be Must-Have (Critical) and at least 1 Value-Add (Developmental)\n' +
    '- Each experience should be 15-40 words\n' +
    (existingText ? '\nAlready generated (do NOT repeat or paraphrase these):\n' + existingText + '\n' : '') +
    '\nReturn ONLY valid JSON, no markdown fences:\n' +
    '{"experiences":[{"text":"Has ...","classification":"Must-Have (Critical)"}]}';

  var t = await callAI(prompt, true);
  if (!t) throw new Error('AI returned empty response. Check your OpenRouter key.');
  var s = t.indexOf('{'), e = t.lastIndexOf('}');
  if (s >= 0 && e > s) t = t.slice(s, e + 1);
  var out = JSON.parse(t);
  var rows = (out.experiences || []).filter(function(exp) {
    return exp && exp.text && exp.text.trim();
  }).map(function(exp) {
    return {
      department: dep, position_name: pos, comp_code: code,
      experience_text: exp.text.trim(),
      classification: exp.classification || 'Important (Performance Enhancing)',
      generated_by: APP.user ? APP.user.email : 'unknown',
      used_count: 0
    };
  });
  if (!rows.length) throw new Error('AI generated no valid experiences. Try again.');
  var ins = await _supabase.from('ai_experience_library').insert(rows).select('*');
  if (ins.error) throw new Error(ins.error.message);
  var key = aiLibKey(dep, pos, code);
  AILib.cache[key] = (AILib.cache[key] || []).concat(ins.data);
  return ins.data;
}

/* ---------- 2. AI Library: slide-over panel ---------- */
async function aiLibPanel(code) {
  if (!FW.position) return;
  AILib.dep = FW.position.department;
  AILib.pos = FW.position.position;
  AILib.code = code;
  var comp = (APP.competencies || []).find(function(c) { return c.code === code; });
  var compName = comp ? comp.competency : code;

  var old = document.getElementById('aiLibPanel');
  if (old) old.remove();

  var overlay = document.createElement('div');
  overlay.id = 'aiLibOverlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:9998;';
  overlay.onclick = function() { aiLibClose(); };
  document.body.appendChild(overlay);

  var panel = document.createElement('div');
  panel.id = 'aiLibPanel';
  panel.style.cssText = 'position:fixed;top:0;right:0;width:min(440px,90vw);height:100vh;background:#fff;' +
    'box-shadow:-4px 0 24px rgba(0,0,0,.15);z-index:9999;overflow-y:auto;display:flex;flex-direction:column;';
  panel.innerHTML =
    '<div style="padding:20px 24px 12px;border-bottom:1px solid #e2e8f0;flex-shrink:0">' +
      '<div style="display:flex;justify-content:space-between;align-items:center">' +
        '<h3 style="margin:0;color:#312e81;font-size:18px">\uD83D\uDCDA AI Experience Library</h3>' +
        '<button onclick="aiLibClose()" style="background:none;border:none;font-size:22px;cursor:pointer;color:#94a3b8;padding:4px 8px">\u00D7</button>' +
      '</div>' +
      '<p style="color:#64748b;font-size:13px;margin:8px 0 0"><strong>' + escapeHtml(compName) + '</strong> \u2022 ' + escapeHtml(AILib.pos) + '</p>' +
    '</div>' +
    '<div id="aiLibContent" style="flex:1;overflow-y:auto;padding:16px 24px"></div>';
  document.body.appendChild(panel);

  try {
    var items = await aiLibFetch(AILib.dep, AILib.pos, code);
    aiLibRender(items);
  } catch(e) {
    var host = document.getElementById('aiLibContent');
    if (host) host.innerHTML = '<p style="color:#dc2626">' + escapeHtml(e.message) + '</p>';
  }
}

function aiLibClose() {
  var p = document.getElementById('aiLibPanel'); if (p) p.remove();
  var o = document.getElementById('aiLibOverlay'); if (o) o.remove();
}

function aiLibRender(items) {
  var host = document.getElementById('aiLibContent');
  if (!host) return;
  var h = '';
  if (items.length) {
    h += '<p style="font-size:13px;color:#475569;margin:0 0 14px">' + items.length + ' suggestion' + (items.length !== 1 ? 's' : '') + ' available</p>';
    items.forEach(function(item) {
      var usedClass = item.used_count > 0 ? 'border-left:3px solid #a7f3d0;' : '';
      h += '<div style="border:1px solid #e2e8f0;border-radius:10px;padding:14px;margin-bottom:10px;background:#f8fafc;' + usedClass + '">' +
        '<p style="margin:0 0 10px;font-size:14px;line-height:1.5;color:#1e293b">' + escapeHtml(item.experience_text) + '</p>' +
        '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">' +
          '<span style="font-size:11px;padding:3px 8px;border-radius:12px;background:#eef2ff;color:#4338ca">' + escapeHtml(item.classification) + '</span>' +
          '<button class="btn btn-outline" data-ailib-id="' + item.id + '" onclick="aiLibUse(this)" ' +
            'style="font-size:12px;padding:4px 14px;color:#4338ca;border-color:#818cf8;border-radius:8px">' +
            (item.used_count > 0 ? '\u2705 Used \u00B7 Add again' : '+ Add to draft') + '</button>' +
        '</div></div>';
    });
  } else {
    h += '<div style="text-align:center;padding:40px 16px;color:#64748b">' +
      '<p style="font-size:40px;margin:0 0 12px">\uD83E\uDD16</p>' +
      '<p style="font-size:15px;margin:0">No AI suggestions yet for this competency.</p>' +
      '<p style="font-size:13px;margin:6px 0 0">Click below to generate position-specific experiences.</p></div>';
  }
  h += '<button class="btn btn-primary" onclick="aiLibGenerateBtn()" ' +
    'style="width:100%;margin:16px 0 8px;padding:10px;border-radius:10px;font-size:14px">' +
    '\uD83E\uDD16 ' + (items.length ? 'Generate 5 more suggestions' : 'Generate AI suggestions') + '</button>';
  host.innerHTML = h;
}

async function aiLibGenerateBtn() {
  var host = document.getElementById('aiLibContent');
  if (!host || !AILib.code) return;
  host.innerHTML = '<div style="text-align:center;padding:40px 16px">' +
    '<div class="spinner" style="margin:0 auto 16px"></div>' +
    '<p style="color:#475569;font-size:14px">\uD83E\uDD16 AI is writing experiences...</p>' +
    '<p style="color:#94a3b8;font-size:12px">Tailored to ' + escapeHtml(AILib.pos) + '</p></div>';
  try {
    await aiLibGenerate(AILib.dep, AILib.pos, AILib.code);
    var all = AILib.cache[aiLibKey(AILib.dep, AILib.pos, AILib.code)] || [];
    showToast('Generated new suggestions');
    aiLibRender(all);
  } catch(e) {
    host.innerHTML = '<p style="color:#dc2626;padding:16px">' + escapeHtml(e.message) + '</p>' +
      '<button class="btn btn-outline" onclick="aiLibGenerateBtn()">Retry</button>';
  }
}

async function aiLibUse(btn) {
  if (!FW.revision || FW.revision.state !== 'Draft' || FW.busy) {
    showToast('Open a draft first'); return;
  }
  var itemId = parseInt(btn.getAttribute('data-ailib-id'), 10);
  var item = null;
  Object.values(AILib.cache).forEach(function(list) {
    var found = list.find(function(i) { return i.id === itemId; });
    if (found) item = found;
  });
  if (!item) { showToast('Suggestion not found'); return; }

  var level = '';
  if (AILib.code && AILib.code.indexOf('CC') === 0) {
    level = prompt('Core level: Foundational, Intermediate, Advanced, Master or Executive');
    if (!level) return;
  }
  FW.revision.items.push({
    id: crypto.randomUUID(), code: AILib.code,
    text: item.experience_text, classification: item.classification,
    level: level, ai_note: null
  });
  FW.dirty = true;

  _supabase.from('ai_experience_library')
    .update({ used_count: (item.used_count || 0) + 1 })
    .eq('id', itemId).then(function() {});
  item.used_count = (item.used_count || 0) + 1;

  btn.textContent = '\u2705 Added!';
  btn.disabled = true;
  showToast('Added: ' + item.experience_text.slice(0, 50) + '\u2026');
  fwRenderRevision();
}

/* ---------- 3. Progress Dashboard (replaces the dropdown for Set Competencies) ---------- */
var fwOriginalOpen = fwOpen;
fwOpen = async function(mode) {
  if (mode !== 'draft') return fwOriginalOpen(mode);

  if (FW.busy) { showToast('Please wait for the current framework operation.'); return; }
  if (FW.dirty && !confirm('Leave without saving this framework draft?')) return;
  var token = ++FW.token;
  FW.mode = mode; FW.revision = null; FW.position = null; FW.dirty = false;
  setContent('<div class="card" style="text-align:center;padding:32px"><div class="spinner" style="margin:0 auto 12px"></div><p>Loading your positions\u2026</p></div>');

  try {
    await fwCatalogue();
    if (token !== FW.token) return;

    var positions = (FW.catalogue.positions || []).filter(function(p) { return p.can_edit; });

    /* Fetch draft status in parallel */
    var draftMap = {};
    try {
      var ds = await _supabase.rpc('cms_draft_status');
      if (ds.data && Array.isArray(ds.data)) {
        ds.data.forEach(function(d) { draftMap[d.position_id] = d; });
      }
    } catch(e) { /* cms_draft_status may not exist yet, degrade gracefully */ }

    var h = '<div id="fwScreen">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:20px">' +
        '<div><h2 style="margin:0;color:#1e293b">Set Competencies</h2>' +
        '<p style="margin:4px 0 0;color:#64748b;font-size:14px">' + positions.length + ' position' + (positions.length !== 1 ? 's' : '') + ' in your department</p></div>' +
      '</div>' +
      '<div id="fwDashboard" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px"></div>' +
    '</div>';
    setContent(h);

    var dashboard = document.getElementById('fwDashboard');

    positions.forEach(function(p) {
      var published = !!p.live_version;
      var liveCount = (p.items || []).length;
      var draft = draftMap[p.id];
      var status, statusColor, statusBg, borderColor, detail;

      if (draft && draft.state === 'Submitted') {
        status = 'Submitted for review';
        statusColor = '#d97706'; statusBg = '#fffbeb'; borderColor = '#fde68a';
        detail = draft.filled_count + ' experiences submitted';
      } else if (draft && draft.state === 'Draft') {
        status = 'Draft in progress';
        statusColor = '#2563eb'; statusBg = '#eff6ff'; borderColor = '#bfdbfe';
        detail = draft.filled_count + '/' + draft.item_count + ' experiences filled';
      } else if (published) {
        status = 'Published \u2713';
        statusColor = '#059669'; statusBg = '#ecfdf5'; borderColor = '#a7f3d0';
        detail = liveCount + ' live experience' + (liveCount !== 1 ? 's' : '');
      } else {
        status = 'Not started';
        statusColor = '#94a3b8'; statusBg = '#f8fafc'; borderColor = '#e2e8f0';
        detail = 'No framework yet';
      }

      var card = document.createElement('div');
      card.className = 'fw-dash-card';
      card.style.cssText = 'border:2px solid ' + borderColor + ';border-radius:14px;padding:20px;cursor:pointer;' +
        'transition:all .2s;background:' + statusBg + ';position:relative';
      card.onmouseenter = function() { card.style.borderColor = '#6366f1'; card.style.transform = 'translateY(-2px)'; card.style.boxShadow = '0 6px 16px rgba(99,102,241,.12)'; };
      card.onmouseleave = function() { card.style.borderColor = borderColor; card.style.transform = 'none'; card.style.boxShadow = 'none'; };

      card.innerHTML =
        '<div style="display:flex;justify-content:space-between;align-items:start;gap:10px;margin-bottom:10px">' +
          '<strong style="font-size:15px;color:#1e293b;line-height:1.3">' + escapeHtml(p.position) + '</strong>' +
          '<span style="font-size:11px;font-weight:600;color:' + statusColor + ';background:' + (draft ? (draft.state === 'Submitted' ? '#fef3c7' : '#dbeafe') : (published ? '#d1fae5' : '#f1f5f9')) +
            ';padding:3px 10px;border-radius:20px;white-space:nowrap;flex-shrink:0">' + status + '</span>' +
        '</div>' +
        '<p style="margin:0 0 4px;font-size:13px;color:#64748b">' + escapeHtml(p.department) + '</p>' +
        '<p style="margin:0;font-size:13px;color:#475569">' + detail + '</p>' +
        '<p style="margin:12px 0 0;font-size:13px;color:#6366f1;font-weight:500">' +
          (draft ? 'Resume editing \u2192' : published ? 'Revise framework \u2192' : 'Start building \u2192') + '</p>';

      card.onclick = function() { fwDashOpen(p); };
      dashboard.appendChild(card);
    });

    if (!positions.length) {
      dashboard.innerHTML = '<div style="text-align:center;padding:40px;color:#64748b">' +
        '<p style="font-size:32px;margin:0 0 8px">\uD83D\uDCCB</p>' +
        '<p>No positions assigned to you. Contact HR if this doesn\u2019t look right.</p></div>';
    }

  } catch(e) {
    setContent('<div class="card"><p>' + escapeHtml(e.message) + '</p></div>');
  }
};

async function fwDashOpen(p) {
  if (FW.dirty && !confirm('Discard unsaved draft edits?')) return;
  FW.dirty = false; FW.revision = null; FW.position = p;

  var screen = document.getElementById('fwScreen');
  if (!screen) return;
  screen.innerHTML =
    '<div style="display:flex;align-items:center;gap:12px;margin-bottom:20px">' +
      '<button class="btn btn-outline" onclick="fwOpen(\'draft\')" style="padding:6px 14px;border-radius:8px">\u2190 All Positions</button>' +
      '<div><h2 style="margin:0;color:#1e293b;font-size:20px">' + escapeHtml(p.position) + '</h2>' +
      '<p style="margin:2px 0 0;font-size:13px;color:#64748b">' + escapeHtml(p.department) + '</p></div>' +
    '</div>' +
    '<div id="fwBody"><div class="card" style="text-align:center;padding:24px"><div class="spinner" style="margin:0 auto 8px"></div><p>Opening framework\u2026</p></div></div>';

  try {
    FW.revision = await fwRPC('open', { position_id: p.id });
    if (FW.revision) fwRenderRevision();
    else fwStartCard();
  } catch(e) {
    document.getElementById('fwBody').innerHTML = '<div class="card"><p>' + escapeHtml(e.message) + '</p></div>';
  }
}

/* ---------- 4. Inject AI Library buttons into the draft revision view ---------- */
var fwOrigRenderRevision = fwRenderRevision;
fwRenderRevision = function() {
  fwOrigRenderRevision();
  if (!FW.revision || FW.revision.state !== 'Draft' || !FW.position || !FW.position.department) return;

  /* Find each "Add experience" button and inject an AI Library button beside it */
  var body = document.getElementById('fwBody');
  if (!body) return;
  body.querySelectorAll('button').forEach(function(btn) {
    var attr = btn.getAttribute('onclick') || '';
    var m = attr.match(/fwAdd\('([^']+)'\)/);
    if (!m) return;
    var code = m[1];
    var wrap = document.createElement('span');
    wrap.style.cssText = 'display:inline-block;margin-left:8px';
    var aiBtn = document.createElement('button');
    aiBtn.type = 'button';
    aiBtn.className = 'btn btn-outline';
    aiBtn.style.cssText = 'background:#eef2ff;border-color:#818cf8;color:#4338ca;border-radius:8px;font-size:13px';
    aiBtn.textContent = '\uD83D\uDCDA AI Library';
    aiBtn.onclick = function(e) { e.stopPropagation(); aiLibPanel(code); };
    wrap.appendChild(aiBtn);
    btn.parentNode.insertBefore(wrap, btn.nextSibling);
  });
};

/* ---------- 5. Spinner CSS (if not already present) ---------- */
(function() {
  if (document.getElementById('aiLibSpinnerStyle')) return;
  var st = document.createElement('style');
  st.id = 'aiLibSpinnerStyle';
  st.textContent = '.spinner{width:32px;height:32px;border:3px solid #e2e8f0;border-top-color:#6366f1;border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}';
  document.head.appendChild(st);
})();

</script>
<script>
/* Review repair: preserve existing palette and permission locks.
   Signature: a separate preview stage makes employee communication intentional. */
var RC={token:0,busy:false,employee:null,message:null,page:0};
function rcHR(){return APP.currentRole==='hr'||APP.currentRole==='hohr';}
async function rcRPC(name,action,data){var r=await _supabase.rpc(name,{p_action:action,p_data:data||{}});if(r.error)throw new Error(r.error.message);return r.data;}
function rcNode(tag,text,parent){var n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(parent)parent.appendChild(n);return n;}
function rcButton(text,fn,parent){var b=rcNode('button',text,parent);b.type='button';b.className='btn btn-outline';b.onclick=async function(){if(b.disabled)return;b.disabled=true;try{await fn();}catch(e){showToast(e.message||'Action failed. Please retry.');}finally{b.disabled=false;}};return b;}
function rcShell(title){setContent('<section class="card" id="rcRoot"></section>');var r=document.getElementById('rcRoot');rcNode('h2',title,r);return r;}
function rcText(label,parent,kind){var l=rcNode('label',label,parent),f=rcNode(kind||'input',undefined,l);f.style.margin='8px 0 16px';return f;}
function rcCard(parent){var c=rcNode('section',undefined,parent);c.className='card';c.style.marginTop='16px';return c;}
async function rcNotify(message){
 var status='failed',detail='';
 try{
  if(!window.emailjs||typeof EMAILJS_SERVICE_ID==='undefined'||EMAILJS_SERVICE_ID.indexOf('PASTE')===0)throw new Error('Email service is not configured');
  await emailjs.send(EMAILJS_SERVICE_ID,EMAILJS_TEMPLATE_ID,{to_email:message.recipient_email,subject:'New message from HR in Kenafric CMS',message:'You have a new message from HR. Sign in to Kenafric CMS and open Messages from HR: '+APP_LINK});
  status='accepted';detail='Email service accepted the notification; delivery is not confirmed.';
 }catch(e){detail=(e.text||e.message||'Email request failed').slice(0,300);}
 try{await rcRPC('cms_employee_communication','notification',{id:message.id,status:status,detail:detail});}catch(e){detail+=' Notification status could not be recorded.';}
 showToast(status==='accepted'?'Message saved. Email notification accepted by the email service.':'Message saved in CMS. Email notification failed: '+detail);

function cmsProspectiveDecision(self,manager,rows){
 if(self===null||manager===null||self===undefined||manager===undefined)return null;
 var prospective=(rows||[]).filter(r=>r.type==='Prospective'||r.type==='Prospective Self');

}

<script>

var HD={company:'',department:'',data:null,epoch:0};
function hdAllowed(){return APP.currentRole==='hr'&&APP.user&&APP.user.modes.isAdmin;}
function hdNorm(s){return String(s||'').trim().toUpperCase();}
async function hdRPC(name,action,data){var q=await _supabase.rpc(name,{p_action:action,p_data:data||{}});if(q.error)throw new Error(q.error.message);return q.data;}
async function hdAll(name,action){var rows=[];for(var page=0;;page++){var batch=await hdRPC(name,action,{page:page});if(!Array.isArray(batch))throw new Error('Unexpected response loading '+action);rows.push(...batch);if(batch.length<500)return rows;}}
async function hdLoad(){
 var key='cms_hr_scope:'+APP.user.email;try{var v=JSON.parse(sessionStorage.getItem(key)||'null');if(v){HD.company=v.company||'';HD.department=v.department||'';}}catch(e){}

 var data={errors:{}};await Promise.all(kinds.map(async k=>{try{data[k]=await hdAll('cms_hr_dashboard',k);}catch(e){data[k]=null;data.errors[k]=e.message;}}));
 try{data.mappings=await hdAll('cms_csuite_routing','list');}catch(e){data.mappings=null;data.errors.mappings=e.message;}
 if(!data.employees)throw new Error('Could not load employees: '+data.errors.employees);

}
function hdModel(data,company,department){
 var people=data.employees.filter(e=>(!company||hdNorm(e.company)===company)&&(!department||hdNorm(e.department)===department)),ids=new Set(people.map(e=>e.employee_id));
 var a=(data.assessments||[]).filter(r=>ids.has(r.employee_id)),done=new Set(a.filter(r=>r.type==='Manager').map(r=>r.employee_id));
 var positions=new Map();people.forEach(e=>{var key=hdNorm(e.department)+'|'+hdNorm(e.position);if(!positions.has(key))positions.set(key,{department:e.department||'',position:e.position||'Not recorded',people:[],criticality:''});positions.get(key).people.push(e);});
 (data.positions||[]).forEach(p=>{var key=hdNorm(p.department)+'|'+hdNorm(p.position_name);if(department&&hdNorm(p.department)!==department)return;if(company&&!positions.has(key))return;if(!positions.has(key))positions.set(key,{department:p.department,position:p.position_name,people:[],criticality:''});var row=positions.get(key);var val=p.criticality||'';if(row.criticality&&hdNorm(row.criticality)!==hdNorm(val))row.conflict=true;else row.criticality=val;});
 var pos=Array.from(positions.values()).map(p=>Object.assign(p,{assessed:p.people.filter(e=>done.has(e.employee_id)).length}));
 var critical=pos.filter(p=>!p.conflict&&!!hdNorm(p.criticality)&&!hdNorm(p.criticality).startsWith('NON'));
 var scope=(rows)=>(rows||[]).filter(r=>ids.has(r.employee_id));
 var review=a.filter(r=>Number(r.pending_rows)>0),returned=a.filter(r=>Number(r.returned_rows)>0);
 var frameworks=(data.frameworks||[]).filter(r=>(!department||hdNorm(r.department)===department)&&(!company||pos.some(p=>hdNorm(p.department)===hdNorm(r.department)&&hdNorm(p.position)===hdNorm(r.position))));
 var reports=scope(data.reports),unassigned=reports.filter(r=>(r.status==='Escalated'||['CSUITE','C_SUITE','C-SUITE'].includes(hdNorm(r.stage)))&&Number(r.assigned_cases)===0);
 var scopes=new Map();people.forEach(e=>{if(hdNorm(e.company)&&hdNorm(e.department))scopes.set(hdNorm(e.company)+'|'+hdNorm(e.department),{company:hdNorm(e.company),department:hdNorm(e.department)});});
 var missing=Array.from(scopes.values()).filter(x=>!(data.mappings||[]).some(m=>m.company===x.company&&m.department===x.department&&m.enabled));
 return {people:people,done:done,assessed:people.filter(e=>done.has(e.employee_id)),notAssessed:people.filter(e=>!done.has(e.employee_id)),positions:pos,critical:critical,coverage:people.length?Math.round(done.size/people.length*100):0,
 review:review,returned:returned,frameworks:frameworks,plans:scope(data.plans),progress:scope(data.progress),redos:scope(data.redos),reports:reports.filter(r=>r.status==='Returned'),unassigned:unassigned,reportApprovals:scope(data.report_approvals),missing:missing,
 recent:a.slice().sort((a,b)=>String(b.assessment_date||'').localeCompare(String(a.assessment_date||''))).slice(0,5)};
}

 ['progress','Development reports for HR acknowledgment',m.progress,'progress','Review progress reports'],['reportApprovals','Report approvals',m.reportApprovals,'report_approvals','Open report approvals'],
 ['redos','Redo requests for HR',m.redos,'redos','Open requests'],['reports','Reports returned by HOHR',m.reports,'reports','Open returned reports'],

function hdActionHTML(data,m,activeOnly){var actions=hdActions(data,m);if(activeOnly)actions=actions.filter(x=>data[x[3]]===null||x[2].length>0);if(!actions.length)return '<p>No outstanding actions in this scope. View all actions to open any queue.</p>';return actions.map(([key,title,list,source,action])=>'<div class="hd-action"><span class="hd-count">'+(data[source]===null?'!':list.length)+'</span><div><h3>'+title+'</h3><p>'+(data[source]===null?'Could not load this queue. Open for details.':key==='review'?list.reduce((n,r)=>n+Number(r.pending_rows),0)+' experience rows awaiting HR review':key==='missing'?'Routing defaults do not change existing case assignments.':list.length?'Open the filtered queue to review individual items.':'No current items in this scope.')+'</p></div>'+hdButton(action,'hr-actions-'+key)+'</div>').join('');}
async function hdDashboard(){
 if(!hdAllowed())return hdLegacyDashboard();var epoch=CN.epoch;setContent('<div class="card">Loading HR dashboard...</div>');
